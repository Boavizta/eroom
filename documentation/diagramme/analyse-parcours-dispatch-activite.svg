lysis.json et coverage-analysis.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.1172" x="706.9727" y="500.0273">doivent exister avec donn&#233;es valides.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6201" x="706.9727" y="515.3379">Sinon : relancer le dispatch une fois.</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="481.5586" x="199.4141" y="394.9277"/><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="217.584" x="213.4141" y="427.9941"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.8828" x="223.4141" y="449.5957">Dispatch A &#8212; Analyse HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7031" x="223.4141" y="463.7285">(20_analyse-har.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.584" x="223.4141" y="477.8613">20a &#8212; trafic (requ&#234;tes, domaines,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.6836" x="223.4141" y="491.9941">codes HTTP, volume Mo)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.8223" x="223.4141" y="506.127">20b &#8212; performance (cache,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.8867" x="223.4141" y="520.2598">doublons, ressources bloquantes)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="223.4141" y="534.3926">-&gt; har-analysis.json</text><rect fill="#E0F0F4" height="133.0625" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="207.9746" x="458.998" y="420.9277"/><text fi