l)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="296.4336" x="113.3066" y="638.4785"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.4336" x="123.3066" y="660.0801">Lire har-analysis.json + coverage-analysis.json</text><path d="M394.8477,688.1895 L394.8477,719.8105 L374.8477,723.8105 L394.8477,727.8105 L394.8477,759.4316 A0,0 0 0 0 394.8477,759.4316 L633.6992,759.4316 A0,0 0 0 0 633.6992,759.4316 L633.6992,698.1895 L623.6992,688.1895 L394.8477,688.1895 A0,0 0 0 0 394.8477,688.1895" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M623.6992,688.1895 L623.6992,698.1895 L633.6992,698.1895 L623.6992,688.1895" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.5425" x="400.8477" y="705.7578">Limites :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4575" x="400.8477" y="721.0684">DOM=0 si HAR sans corps HTML</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8516" x="400.8477" y="736.3789">SPA : DOM = &#233;tat initial seulement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.8418" x="400.8477" y="751.6895">-&gt; document&#233; dans le rapport</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="226.6484" x="148.1992" y="692.6113"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0469" x="158.1992" y="714.2129">&#201;tape 35 &#8212; har_metrics.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.7617" x="158.1992" y="728.3457">Calcul score/grade A-G par page</text><text fill="#1C2856" font-family="sans-