pacing" textLength="269.9531" x="126.5469" y="109.9893">SKILL.md -&gt; lit 25_dispatch-orchestration.md</text><rect fill="#ECECF2" height="205.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="640.5034" x="78.6768" y="143.4199"/><path d="M385.6914,143.4199 L385.6914,152.9082 L375.6914,162.9082 L78.6768,162.9082" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160.8496" x="81.6768" y="157.9551">Wave 0 &#8212; Localisation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7354" x="246.9561" y="157.9551">(contexte principal)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="232.2441" x="145.4014" y="179.9082"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.2441" x="155.4014" y="201.5098">Lire args : dossier ou fichiers directs</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="345.6934" x="88.6768" y="234.041"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="325.6934" x="98.6768" y="255.6426">Identifier .har + Coverage-*.json + cwv.json (optionnel)</text><path d="M379.0684,291.9961 L379.0684,308.3066 L359.0684,312.3066 L379.0684,316.3066 L379.0684,332.6172 A0,0 0 0 0 379.0684,332.6172 L709.1802,332.6172 A0,0 0 0 0 709.1802,332.6172 L709.1802,301.9961 L699.1802,291.9961 L379.0684,291.9961 A0,0 0 0 0 379.0684,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M699.1802,291.9961 L699.1802,301.9961 L709.1802,301.9961 L699.1802,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4878" x="385.0684" y="309.5645">&#9989; Wave 0 termin&#233;e &#8212; fichiers pr&#234;ts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.1118" x="385.0684" y="324.875">Les dispatches suivants lisent les fichiers disque.</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="195.0898" x="163.9785" y="288.1738"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.0898" x="173.9785" y="309.7754">V&#233;rifier existence + taille HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.998" x="173.9785" y="323.9082">(lecture s&#233;lective si &gt; 5 Mo)</text><rect fill="#ECECF2" height="233.5508" style="stroke:#5BA1BC;stroke-width:1.5;" width="816.1787" x="11" y="358.4395"/><path d="M409.0762,358.4395 L409.0762,367.9277 L399.0762,377.9277 L11,377.9277" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="193.1836" x="14" y="372.9746">Wave 1 &#8212; HAR + Coverage</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.4629" x="211.6133" y="372.9746">(2 sous-agents en parall&#232;le)</text><path d="M522.3027,451.8379 L522.3027,523.0801 L817.1787,523.0801 L817.1787,461.8379 L807.1787,451.8379 L522.3027,451.8379" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M807.1787,451.8379 L807.1787,461.8379 L817.1787,461.8379 L807.1787,451.8379" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.2856" x="528.3027" y="469.4063">Condition de r&#233;ussite :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.876" x="528.3027" y="484.7168">har-analysis.json et coverage-analysis.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.1172" x="528.3027" y="500.0273">doivent exister avec donn&#233;es valides.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6201" x="528.3027" y="515.3379">Sinon : relancer le dispatch une fois.</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="481.3027" x="21" y="394.9277"/><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="217.584" x="34.7441" y="427.9941"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.8828" x="44.7441" y="449.5957">Dispatch A &#8212; Analyse HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7031" x="44.7441" y="463.7285">(20_analyse-har.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="197.584" x="44.7441" y="477.8613">20a &#8212; trafic (requ&#234;tes, domaines,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.6836" x="44.7441" y="491.9941">codes HTTP, volume Mo)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.8223" x="44.7441" y="506.127">20b &#8212; performance (cache,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.8867" x="44.7441" y="520.2598">doublons, ressources bloquantes)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="44.7441" y="534.3926">-&gt; har-analysis.json</text><rect fill="#E0F0F4" height="133.0625" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="207.9746" x="280.3281" y="420.9277"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdju