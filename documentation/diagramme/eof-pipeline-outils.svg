<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="951px" preserveAspectRatio="none" style="width:661px;height:951px;background:#FFFFFF;" version="1.1" viewBox="0 0 661 951" width="661px" zoomAndPan="magnify"><title>Skill EOF (EROOM Optimization Framework) &#8212; Pipeline outils</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="441.6221" x="108.3936" y="33.5352">Skill EOF (EROOM Optimization Framework) &#8212; Pipeline outils</text></g><ellipse cx="156.6182" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M322.2363,83.0664 L322.2363,114.6875 L302.2363,118.6875 L322.2363,122.6875 L322.2363,154.3086 A0,0 0 0 0 322.2363,154.3086 L649.4092,154.3086 A0,0 0 0 0 649.4092,154.3086 L649.4092,93.0664 L639.4092,83.0664 L322.2363,83.0664 A0,0 0 0 0 322.2363,83.0664" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M639.4092,83.0664 L639.4092,93.0664 L649.4092,93.0664 L639.4092,83.0664" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.5454" x="328.2363" y="100.6348">Endpoints d'export classiques (CSV/XLSX)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.7876" x="328.2363" y="115.9453">&#233;chouent ici : redirection 307 vers une URL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1729" x="328.2363" y="131.2559">sign&#233;e &#224; usage unique, invalide en appel s&#233;par&#233;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.1538" x="328.2363" y="146.5664">Seule la voie gviz fonctionne, un onglet &#224; la fois.</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="291.2363" x="11" y="87.4883"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="190.207" x="21" y="109.0898">Source &#8212; Google Sheet publique</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.2363" x="21" y="123.2227">"EOF-V.1.1 (EROOM Optimization Framework)"</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.5547" x="21" y="137.3555">9 onglets, 1 gid par onglet</text><rect fill="#ECECF2" height="125.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="607.8145" x="24.7041" y="164.3086"/><path d="M368.1133,164.3086 L368.1133,173.7969 L358.1133,183.7969 L24.7041,183.7969" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="161.7861" x="27.7041" y="178.8438">Bloc 1 &#8212; R&#233;cup&#233;ration</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167.1934" x="193.9199" y="178.8438">(9 appels, un par onglet)</text><path d="M298.5322,203.4414 L298.5322,235.0625 L278.5322,239.0625 L298.5322,243.0625 L298.5322,274.6836 A0,0 0 0 0 298.5322,274.6836 L622.5186,274.6836 A0,0 0 0 0 622.5186,274.6836 L622.5186,213.4414 L612.5186,203.4414 L298.5322,203.4414 A0,0 0 0 0 298.5322,203.4414" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M612.5186,203.4414 L612.5186,213.4414 L622.5186,213.4414 L612.5186,203.4414" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.7539" x="304.5322" y="221.0098">Champ "f" (format&#233;) pr&#233;f&#233;r&#233; &#224; "v" (brut) :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.2856" x="304.5322" y="236.3203">contourne un bug de mise en forme du Sheet</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.5581" x="304.5322" y="251.6309">source (IDs de crit&#232;re stock&#233;s comme des</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.9863" x="304.5322" y="266.9414">dates sur 3 onglets, ex. 3.1 -&gt; Date(2025,0,3)).</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="243.8281" x="34.7041" y="200.7969"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.8281" x="44.7041" y="222.3984">curl gviz/tq?tqx=out:json&amp;gid=&lt;gid&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.2598" x="44.7041" y="236.5313">x9 (&#192; LIRE, Diagnostic rapide,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.1563" x="44.7041" y="250.6641">6 piliers, Synth&#232;se)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.7285" x="44.7041" y="264.7969">-&gt; tmp/eof-gviz/*.json</text><rect fill="#ECECF2" height="527.3008" style="stroke:#5BA1BC;stroke-width:1.5;" width="575.043" x="11.8779" y="299.3281"/><path d="M440.3262,299.3281 L440.3262,308.8164 L430.3262,318.8164 L11.8779,318.8164" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="194.9814" x="14.8779" y="313.8633">Bloc 2 &#8212; build_template.py</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.0371" x="214.2891" y="313.8633">(d&#233;terministe, aucun calcul LLM)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="119.5156" x="96.8604" y="335.8164"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="99.5156" x="106.8604" y="357.418">Parser les 9 JSON</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="192.0723" x="60.582" y="389.9492"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.0723" x="70.582" y="411.5508">Onglet 0 &#8212; Diagnostic rapide</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.5742" x="70.582" y="425.6836">&#201;valuation = &#233;chelle 1 &#224; 5</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="147.9199" x="70.582" y="439.8164">(5 crans texte par crit&#232;re)</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="242.1641" x="35.5361" y="472.3477"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1641" x="45.5361" y="493.9492">Onglets 1 &#224; 5 &#8212; Produit, Architecture,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.4336" x="45.5361" y="508.082">Infrastructure, Stockage, Algo &amp; Code</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.2188" x="45.5361" y="522.2148">&#201;valuation = 5 choix cat&#233;goriels</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.4766" x="45.5361" y="536.3477">(Point fort / Potentiel identifi&#233; /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1582" x="45.5361" y="550.4805">Non applicable / &#192; &#233;valuer / En cours)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="224.1523" x="44.542" y="583.0117"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="204.1523" x="54.542" y="604.6133">Onglet 6 &#8212; Facilit&#233; de changement</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.5918" x="54.542" y="618.7461">&#201;valuation = 3 choix DIFF&#201;RENTS</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.2305" x="54.542" y="632.8789">(Facile / Effort mod&#233;r&#233; / Difficile)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="257.0352" x="28.1006" y="665.4102"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.5371" x="38.1006" y="687.0117">Injecter 3 liens hypertexte + 2 logos</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.0352" x="38.1006" y="701.1445">(r&#233;cup&#233;r&#233;s une fois depuis l'Excel fourni,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.8926" x="38.1006" y="715.2773">gviz seul ne les fournit pas)</text><path d="M311.3584,743.3867 L311.3584,775.0078 L291.3584,779.0078 L311.3584,783.0078 L311.3584,814.6289 A0,0 0 0 0 311.3584,814.6289 L576.9209,814.6289 A0,0 0 0 0 576.9209,814.6289 L576.9209,753.3867 L566.9209,743.3867 L311.3584,743.3867 A0,0 0 0 0 311.3584,743.3867" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M566.9209,743.3867 L566.9209,753.3867 L576.9209,753.3867 L566.9209,743.3867" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.1338" x="317.3584" y="760.9551">Aucune case n'est pr&#233;-coch&#233;e.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.5625" x="317.3584" y="776.2656">Seul "Niveau d'impact" affiche la valeur</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.9004" x="317.3584" y="791.5762">fixe du r&#233;f&#233;rentiel (donn&#233;e, pas une</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="119.2788" x="317.3584" y="806.8867">r&#233;ponse &#224; donner).</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="269.4805" x="21.8779" y="747.8086"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.4805" x="31.8779" y="769.4102">G&#233;n&#233;rer le sommaire + la section Synth&#232;se</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="233.2031" x="31.8779" y="783.543">(formule de score document&#233;e en texte,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.1543" x="31.8779" y="797.6758">aucun score chiffr&#233; : template vierge)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="222.1426" x="45.5469" y="864.0527"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1426" x="55.5469" y="885.6543">livrer le template Markdown vierge</text><ellipse cx="156.6182" cy="929.1855" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="156.6182" cy="929.1855" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="156.6182" x2="156.6182" y1="67.4883" y2="87.4883"/><polygon fill="#5BA1BC" points="152.6182,77.4883,156.6182,87.4883,160.6182,77.4883,156.6182,81.4883" style="stroke:#5BA1BC;stroke-width:1;"/><line style="stroke:#5BA1BC;str