;stroke-width:1.5;"/><text x="92.746" y="853.023" fill="#000" font-size="14" textLength="193.443" font-weight="700">REPORT — first generation</text><text x="290.803" y="853.023" fill="#000" font-size="14" textLength="81.901" font-weight="700">(automatic)</text></g><!--cluster **EOF QUESTIONNAIRE** (manual, mission decision)--><g class="cluster" data-qualified-name="..EOF QUESTIONNAIRE.. .manual. mission decision." id="ent0021" data-source-line="49"><polygon points="75.746,995.488,430.337,995.488,437.337,1017.977,439.746,1017.977,439.746,1272.488,75.746,1272.488,75.746,995.488" fill="#9BD0DD" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="75.746" y1="1017.977" x2="437.337" y2="1017.977" style="stroke:#000;stroke-width:1.5;"/><text x="79.746" y="1011.023" fill="#000" font-size="14" textLength="151.197" font-weight="700">EOF QUESTIONNAIRE</text><text x="235.557" y="1011.023" fill="#000" font-size="14" textLength="192.78" font-weight="700">(manual, mission decision)</text></g><!--cluster **REPORT — regeneration** (automatic)--><g class="cluster" data-qualified-name="..REPORT . regeneration.. .automatic." id="ent0026" data-source-line="54"><polygon points="97.746,1280.488,363.347,1280.488,370.347,1302.977,417.746,1302.977,417.746,1401.488,97.746,1401.488,97.746,1280.488" fill="none" style="stroke:#000;stroke-width:1.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="97.746" y1="1302.977" x2="370.347" y2="1302.977" style="stroke:#000;stroke-width:1.5;"/><text x="101.746" y="1296.023" fill="#000" font-size="14" textLength="173.086" font-weight="700">REPORT — regeneration</text><text x="279.446" y="1296.023" fill="#000" font-size="14" textLength="81.901" font-weight="700">(automatic)</text></g><g class="end_entity" data-qualified-name="end" id="ent0029" data-source-line="58"><ellipse cx="257.746" cy="1432.488" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1.5;"/><ellipse cx="257.746" cy="1432.488" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="start_entity" data-qualified-name="..MANUAL CAPTURE.. .prerequisite. human. outside the skill..start" id="ent0002" data-source-line="28"><ellipse cx="257.746" cy="102.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><rect x="133.746" y="152.488" width="247.818" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="143.746" y="174.09" fill="#1C2856" font-size="12" textLength="227.818">Network : Preserve log + Disable cache</text><text x="143.746" y="188.223" fill="#1C2856" font-size="12" textLength="175.846">Full journey, cookies accepted</text><text x="143.746" y="202.355" fill="#1C2856" font-size="12" textLength="224.848">-> 'Save all as HAR with content' (.har)</text><rect x="121.246" y="250.488" width="272.902" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="131.246" y="272.09" fill="#1C2856" font-size="12" textLength="180.504">Coverage panel (Cmd+Shift+P)</text><text x="131.246" y="286.223" fill="#1C2856" font-size="12" textLength="123.539">Record, reload, scroll</text><text x="131.246" y="300.355" fill="#1C2856" font-size="12" textLength="252.902">-> export JSON per page (Coverage-*.json)</text><rect x="74.746" y="379.488" width="365.961" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="84.746" y="401.09" fill="#1C2856" font-size="12" textLength="185.531">HAR, Coverage, Core Web Vitals</text><text x="84.746" y="415.223" fill="#1C2856" font-size="12" textLength="220.658">(analyze_har.py, coverage_metrics.py,</text><text x="84.746" y="429.355" fill="#1C2856" font-size="12" textLength="345.961">collect_cwv_pagespeed.py or run_lighthouse.sh as fallback)</text><rect x="130.746" y="508.488" width="254" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="140.746" y="530.09" fill="#1C2856" font-size="12" textLength="190.658">run_eof.py compares the already</text><text x="140.746" y="544.223" fill="#1C2856" font-size="12" textLength="234">collected data against the EOF reference</text><text x="140.746" y="558.355" fill="#1C2856" font-size="12" textLength="230.004">(~10 criteria out of 54 settled by script,</text><text x="140.746" y="572.488" fill="#1C2856" font-size="12" textLength="162.967">the rest stays 'I don't know')</text><rect x="84.746" y="652.488" width="346.127" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.746" y="674.09" fill="#1C2856" font-size="12" textLength="239.484">/efootprint -> Boavizta model (reference</text><text x="94.746" y="688.223" fill="#1C2856" font-size="12" textLength="326.127">+ 3 cumulative scenarios prio1 / prio1+2 / prio1+2+3)</text><text x="94.746" y="702.355" fill="#1C2856" font-size="12" textLength="177.281">-> data available for the NEXT</text><text x="94.746" y="716.488" fill="#1C2856" font-size="12" textLength="273.188">report generation, not an isolated final add-on</text><rect x="127.246" y="765.488" width="261.072" height="48.266" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="137.246" y="787.09" fill="#1C2856" font-size="12" textLength="241.072">Possible human action: annual traffic and</text><text x="137.246" y="801.223" fill="#1C2856" font-size="12" textLength="236.695">cloud instance size, if not auto-detected</text><rect x="105.246" y="880.488" width="305.223" height="90.664" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="115.246" y="902.09" fill="#1C2856" font-size="12" textLength="143.156">generate_report_html.py</text><text x="115.246" y="916.223" fill="#1C2856" font-size="12" textLength="204.908">(+ check_report_values.py, internal</text><text x="115.246" y="930.355" fill="#1C2856" font-size="12" textLength="120.299">non-blocking check)</text><text x="115.246" y="944.488" fill="#1C2856" font-size="12" textLength="285.223">-> already contains the automatic EOF judgment</text><text x="115.246" y="958.621" fill="#1C2856" font-size="12" textLength="248.555">(partial) and the CO2e if already calculated</text><rect x="140.746" y="1038.488" width="234.195" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="150.746" y="1060.09" fill="#1C2856" font-size="12" textLength="214.195">When: after the automatic judgment,</text><text x="150.746" y="1074.223" fill="#1C2856" font-size="12" textLength="132.943">only on the criteria left</text><text x="150.746" y="1088.355" fill="#1C2856" font-size="12" textLength="168.92">'I don't know' - never before,</text><text x="150.746" y="1102.488" fill="#1C2856" font-size="12" textLength="153.75">never triggered on its own</text><rect x="118.246" y="1151.488" width="278.902" height="104.797" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="128.246" y="1173.09" fill="#1C2856" font-size="12" textLength="245.443">generate_questionnaire.py -> file to fill in</text><text x="128.246" y="1187.223" fill="#1C2856" font-size="12" textLength="245.191">(questionnaire-eof.md), sent to the client,</text><text x="128.246" y="1201.355" fill="#1C2856" font-size="12" textLength="258.902">filled in, read back (parse_questionnaire.py),</text><text x="128.246" y="1215.488" fill="#1C2856" font-size="12" textLength="237.176">merged (merge_lots.py) according to the</text><text x="128.246" y="1229.621" fill="#1C2856" font-size="12" textLength="249.85">precedence collected > estimated > stated</text><text x="128.246" y="1243.754" fill="#1C2856" font-size="12" textLength="131.848">> declared > assumed</text><rect x="113.746" y="1323.488" width="288.389" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="123.746" y="1345.09" fill="#1C2856" font-size="12" textLength="143.156">generate_report_html.py</text><text x="123.746" y="1359.223" fill="#1C2856" font-size="12" textLength="268.389">-> reflects the merged questionnaire answers</text><text x="123.746" y="1373.355" fill="#1C2856" font-size="12" textLength="193.248">(+ CO2e if calculated meanwhile)</text><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-link-type="dependency"><polygon points="257.746,152.194,261.746,143.194,257.746,147.194,253.746,143.194,257.746,152.194" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M257.746,116.521 C257.746,125.835 257.746,134.626 257.746,147.194" style="stroke:#5BA1BC;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk6" data-link-type="dependency"><polygon points="257.746,250.484,261.746,241.484,257.746,245.484,253.746,241.484,257.746,250.484" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M257.746,214.6 C257.746,226.037 257.746,234.056 257.746,245.484" style="stroke:#5BA1BC;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk9" data-link-type="dependency"><polygon points="257.746,379.167,261.746,370.167,257.746,374.167,253.746,370.167,257.746,379.167" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M257.746,312.586 C257.746,332.684 257.746,354.023 257.746,374.167" style="stroke:#5BA1BC;stroke-width:1;" fill="none"/></g><g class="link" data-entity-1="ent0008" data-entity-2="ent0011" id="lnk12" data-link-type="dependency"><polygon points="257.746,508.205,261.746,499.205,257.746,503.205,253.746,499.205,257.746,508.205" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M257.746,441.673 C257.746,461.345 257.746,482.172 257.746,503.205" style="stroke:#5BA1BC;stroke-width:1;" fill="none"/></g><g clas