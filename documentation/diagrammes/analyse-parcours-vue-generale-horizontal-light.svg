<?xml version="1.0" encoding="UTF-8"?>
<!--
  Diagramme construit A LA MAIN (coordonnees fixes), pas via `plantuml`.
  Raison : PlantUML (activity beta) ne sait pas produire cette disposition precise
  (2 colonnes, RAPPORT aligne exactement en haut avec COLLECTE, connecteur en U
  dans la gouttiere) sans inverser l'ordre des colonnes - teste et confirme le
  2026-09-16 (5 approches differentes, meme limite chaque fois).
  Le fichier .puml du meme nom reste la reference du CONTENU textuel ; ne pas
  regenerer ce .svg avec `plantuml -tsvg`, il serait ecrase par une disposition
  degradee.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="900" viewBox="0 0 1560 900" style="background:#FFFFFF">
  <rect x="0" y="0" width="1560" height="900" fill="#FFFFFF"/>

  <text x="40" y="28" font-family="sans-serif" font-size="20" font-weight="bold" fill="#000000">Analyse de parcours web — Vue generale du workflow (par thematique, 2 colonnes)</text>

  <!-- start -->
  <circle cx="360" cy="70" r="9" fill="#222222"/>
  <line x1="360" y1="79" x2="360" y2="96" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="354,90 366,90 360,100" fill="#5BA1BC"/>

  <!-- COLLECTE -->
  <rect x="40" y="100" width="640" height="143" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="40" y="100" width="640" height="38" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">COLLECTE (automatique)</text>
  <rect x="55" y="150" width="610" height="78" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="172" font-family="sans-serif" font-size="13" fill="#1C2856">HAR, Coverage, Core Web Vitals</text>
  <text x="70" y="190" font-family="sans-serif" font-size="13" fill="#1C2856">(analyze_har.py, coverage_metrics.py,</text>
  <text x="70" y="208" font-family="sans-serif" font-size="13" fill="#1C2856">collect_cwv_pagespeed.py ou run_lighthouse.sh en repli)</text>

  <line x1="360" y1="243" x2="360" y2="261" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="354,255 366,255 360,265" fill="#5BA1BC"/>

  <!-- JUGEMENT AUTOMATIQUE EOF -->
  <rect x="40" y="273" width="640" height="161" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="40" y="273" width="640" height="38" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="298" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">JUGEMENT AUTOMATIQUE EOF (automatique)</text>
  <rect x="55" y="323" width="610" height="96" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="345" font-family="sans-serif" font-size="13" fill="#1C2856">run_eof.py confronte les donnees</text>
  <text x="70" y="363" font-family="sans-serif" font-size="13" fill="#1C2856">deja collectees au referentiel EOF</text>
  <text x="70" y="381" font-family="sans-serif" font-size="13" fill="#1C2856">(~10 criteres sur 54 tranches par script,</text>
  <text x="70" y="399" font-family="sans-serif" font-size="13" fill="#1C2856">le reste reste 'je ne sais pas')</text>

  <line x1="360" y1="434" x2="360" y2="452" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="354,446 366,446 360,456" fill="#5BA1BC"/>

  <!-- IMPACT CO2e (special) -->
  <rect x="40" y="464" width="640" height="236" fill="#9BD0DD" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="489" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">IMPACT CO2e (optionnel, a tout moment)</text>
  <line x1="40" y1="502" x2="680" y2="502" stroke="#000000" stroke-width="1.5"/>
  <rect x="55" y="514" width="610" height="96" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="536" font-family="sans-serif" font-size="13" fill="#1C2856">/efootprint -&gt; modele Boavizta (reference</text>
  <text x="70" y="554" font-family="sans-serif" font-size="13" fill="#1C2856">+ 3 scenarios cumules prio1 / prio1+2 / prio1+2+3)</text>
  <text x="70" y="572" font-family="sans-serif" font-size="13" fill="#1C2856">-&gt; donnees disponibles pour la PROCHAINE</text>
  <text x="70" y="590" font-family="sans-serif" font-size="13" fill="#1C2856">generation du rapport, pas un ajout final isole</text>
  <rect x="55" y="625" width="610" height="60" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="647" font-family="sans-serif" font-size="13" fill="#1C2856">Action humaine possible : trafic annuel et</text>
  <text x="70" y="665" font-family="sans-serif" font-size="13" fill="#1C2856">taille d'instance cloud, si non auto-detectes</text>

  <!-- connecteur en U : IMPACT CO2e -> RAPPORT (premiere generation) -->
  <polyline points="360,700 360,725 780,725 780,85 1180,85 1180,97" fill="none" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1174,91 1186,91 1180,101" fill="#5BA1BC"/>

  <!-- RAPPORT - premiere generation -->
  <rect x="860" y="100" width="640" height="179" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="860" y="100" width="640" height="38" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="875" y="125" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">RAPPORT — premiere generation (automatique)</text>
  <rect x="875" y="150" width="610" height="114" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="890" y="172" font-family="sans-serif" font-size="13" fill="#1C2856">generate_report_html.py</text>
  <text x="890" y="190" font-family="sans-serif" font-size="13" fill="#1C2856">(+ check_valeurs_rapport.py, controle</text>
  <text x="890" y="208" font-family="sans-serif" font-size="13" fill="#1C2856">interne non bloquant)</text>
  <text x="890" y="226" font-family="sans-serif" font-size="13" fill="#1C2856">-&gt; contient deja le jugement EOF automatique</text>
  <text x="890" y="244" font-family="sans-serif" font-size="13" fill="#1C2856">(partiel) et le CO2e si deja calcule</text>

  <line x1="1180" y1="279" x2="1180" y2="297" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1174,291 1186,291 1180,301" fill="#5BA1BC"/>

  <!-- QUESTIONNAIRE EOF (special) -->
  <rect x="860" y="309" width="640" height="308" fill="#9BD0DD" stroke="#000000" stroke-width="1.5"/>
  <text x="875" y="334" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">QUESTIONNAIRE EOF (manuel, decision de mission)</text>
  <line x1="860" y1="347" x2="1500" y2="347" stroke="#000000" stroke-width="1.5"/>
  <rect x="875" y="359" width="610" height="96" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="890" y="381" font-family="sans-serif" font-size="13" fill="#1C2856">Quand : apres le jugement automatique,</text>
  <text x="890" y="399" font-family="sans-serif" font-size="13" fill="#1C2856">uniquement sur les criteres restes</text>
  <text x="890" y="417" font-family="sans-serif" font-size="13" fill="#1C2856">'je ne sais pas' - jamais avant,</text>
  <text x="890" y="435" font-family="sans-serif" font-size="13" fill="#1C2856">jamais declenche seul</text>
  <rect x="875" y="470" width="610" height="132" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="890" y="492" font-family="sans-serif" font-size="13" fill="#1C2856">generate_questionnaire.py -&gt; fichier a remplir</text>
  <text x="890" y="510" font-family="sans-serif" font-size="13" fill="#1C2856">(questionnaire-eof.md), envoye au client,</text>
  <text x="890" y="528" font-family="sans-serif" font-size="13" fill="#1C2856">rempli, relu (parse_questionnaire.py),</text>
  <text x="890" y="546" font-family="sans-serif" font-size="13" fill="#1C2856">fusionne (fusionner_lots.py) selon la</text>
  <text x="890" y="564" font-family="sans-serif" font-size="13" fill="#1C2856">precedence collecte &gt; estime &gt; precise</text>
  <text x="890" y="582" font-family="sans-serif" font-size="13" fill="#1C2856">&gt; declare &gt; suppose</text>

  <line x1="1180" y1="617" x2="1180" y2="635" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1174,629 1186,629 1180,639" fill="#5BA1BC"/>

  <!-- RAPPORT - regeneration -->
  <rect x="860" y="647" width="640" height="143" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="860" y="647" width="640" height="38" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="875" y="672" font-family="sans-serif" font-size="15" font-weight="bold" fill="#000000">RAPPORT — regeneration (automatique)</text>
  <rect x="875" y="697" width="610" height="78" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="890" y="719" font-family="sans-serif" font-size="13" fill="#1C2856">generate_report_html.py</text>
  <text x="890" y="737" font-family="sans-serif" font-size="13" fill="#1C2856">-&gt; reflete les reponses du questionnaire</text>
  <text x="890" y="755" font-family="sans-serif" font-size="13" fill="#1C2856">fusionnees (+ CO2e si calcule entre-temps)</text>

  <!-- stop -->
  <line x1="1180" y1="790" x2="1180" y2="815" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1174,809 1186,809 1180,819" fill="#5BA1BC"/>
  <circle cx="1180" cy="830" r="11" fill="none" stroke="#222222" stroke-width="1.5"/>
  <circle cx="1180" cy="830" r="6" fill="#222222"/>
</svg>
