hAdjust="spacing" textLength="185.5313" x="41.67" y="178.1498">HAR, Coverage, Core Web Vitals</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="41.67" y="192.2827">(analyze_har.py, coverage_metrics.py,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.6563" x="41.67" y="206.4155">collect_cwv_pagespeed.py ou run_lighthouse.sh en repli)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="251.9492" x="1094.03" y="149.4883"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1406" x="1104.03" y="171.0898">run_eof.py confronte les donnees</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1484" x="1104.03" y="185.2227">deja collectees au referentiel EOF</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.9492" x="1104.03" y="199.3555">(~10 criteres sur 54 tranches par script,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="167.2031" x="1104.03" y="213.4883">le reste reste 'je ne sais pas')</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="331.4492" x="1432.28" y="149.4883"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.1699" x="1442.28" y="171.0898">/efootprint -&gt; modele Boavizta (reference</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.4492" x="1442.28" y="185.2227">+ 3 scenarios cumules prio1 / prio1+2 / prio1+2+3)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.7227" x="1442.28" y="199.3555">-&gt; donnees disponibles pour la PROCHAINE</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.7109" x="1442.28" y="213.4883">generation du rapport, pas un ajout final isole</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="275.2813" x="1474.36" y="322.2183"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.7891" x="1484.36" y="343.8198">Action humaine possible : trafic annuel et</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.2813" x="1484.36" y="357.9527">taille d'instance cloud, si non auto-detectes</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.2324" x="1837.88" y="301.0183"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="1847.88" y="322.6198">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="1847.88" y="336.7527">(+ check_valeurs_rapport.py, controle</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.8496" x="1847.88" y="350.8855">interne non bloquant)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.2324" x="1847.88" y="365.0183">-&gt; contient deja le jugement EOF automatique</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1055" x="1847.88" y="379.1511">(partiel) et le CO2e si deja calcule</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="255.5176" x="2244.24" y="308.0783"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.5176" x="2254.24" y="329.6798">Quand : apres le jugement automatique,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.2227" x="2254.24" y="343.8127">uniquement sur les criteres restes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.207" x="2254.24" y="357.9455">'je ne sais pas' - jamais avant,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.2715" x="2254.24" y="372.0783">jamais declenche seul</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="291.3828" x="2235.31" y="445.4783"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.3828" x="2245.31" y="467.0798">generate_questionnaire.py -&gt; fichier a remplir</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9199" x="2245.31" y="481.2127">(questionnaire-eof.md), envoye au client,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.0215" x="2245.31" y="495.3455">rempli, relu (parse_questionnaire.py),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.1484" x="2245.31" y="509.4783">fusionne (fusionner_lots.py) selon la</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.2363" x="2245.31" y="523.6111">precedence collecte &gt; estime &gt; precise</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.3887" x="2245.31" y="537.7439">&gt; declare &gt; suppose</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="274.209" x="2613.9" y="466.6783"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="2623.9" y="488.2798">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.6777" x="2623.9" y="502.4127">-&gt; reflete les reponses du questionnaire</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.209" x="2623.9" y="516.5455">fusionnees (+ CO2e si calcule entre-temps)</text><g class="entity" data-qualified-name="GMN6" data-source-line="23" id="ent0007"><path d="M414.24,159.7883 L414.24,183.7483 L382.7,187.7483 L414.24,191.7483 L414.24,215.7199 A0,0 0 0 0 414.24,215.7199 L691.7678,215.7199 A0,0 0 0 0 691.7678,215.7199 L691.7678,169.7883 L681.7678,159.7883 L414.24,159.7883 A0,0 0 0 0 414.24,159.7883" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M681.7678,159.7883 L681.7678,169.7883 L691.7678,169.7883 L681.7678,159.7883" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.1387" x="420.24" y="177.3566">Legende</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4668" x="420.24" y="192.6672">Fond gris pale : automatique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.5278" x="420.24" y="207.9777">(calcul machine, aucune action humaine)</text></g><g class="entity" data-qualified-name="GMN9" data-source-line="29" id="ent0010"><path d="M712.2,167.4383 L712.2,208.0594 L1031.8064,208.0594 L1031.8064,177.4383 L1021.8064,167.4383 L712.2,167.4383" fill="#9BD0DD"/><path d="M1021.8064,167.4383 L1021.8064,177.4383 L1031.8064,177.4383 L1021.8064,167.4383" fill="#9BD0DD"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.3921" x="718.2" y="185.0066">Fond bleu clair : action humaine requise</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6064" x="