<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1967px" preserveAspectRatio="none" style="width:1099px;height:1967px;background:#FFFFFF;" version="1.1" viewBox="0 0 1099 1967" width="1099px" zoomAndPan="magnify"><title>M&#233;canisme DISPATCH &#8212; Flux des vagues d'analyse de parcours</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="459.1221" x="318.8145" y="33.5352">M&#233;canisme DISPATCH &#8212; Flux des vagues d'analyse de parcours</text></g><ellipse cx="485.499" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M650.4756,77.4883 L650.4756,101.4541 L630.4756,105.4541 L650.4756,109.4541 L650.4756,133.4199 A0,0 0 0 0 650.4756,133.4199 L974.3477,133.4199 A0,0 0 0 0 974.3477,133.4199 L974.3477,87.4883 L964.3477,77.4883 L650.4756,77.4883 A0,0 0 0 0 650.4756,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M964.3477,77.4883 L964.3477,87.4883 L974.3477,87.4883 L964.3477,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.4448" x="656.4756" y="95.0566">D&#233;tection plateforme :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.8721" x="656.4756" y="110.3672">- Claude Code -&gt; sous-agents isol&#233;s (parall&#232;le)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.5938" x="656.4756" y="125.6777">- Autres -&gt; ex&#233;cution s&#233;quentielle inline</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="289.9531" x="340.5225" y="88.3877"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="269.9531" x="350.5225" y="109.9893">SKILL.md -&gt; lit 25_dispatch-orchestration.md</text><rect fill="#ECECF2" height="205.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="640.5034" x="302.6523" y="143.4199"/><path d="M609.667,143.4199 L609.667,152.9082 L599.667,162.9082 L302.6523,162.9082" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160.8496" x="305.6523" y="157.9551">Wave 0 &#8212; Localisation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7354" x="470.9316" y="157.9551">(contexte principal)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="232.2441" x="369.377" y="179.9082"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.2441" x="379.377" y="201.5098">Lire args : dossier ou fichiers directs</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="345.6934" x="312.6523" y="234.041"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="325.6934" x="322.6523" y="255.6426">Identifier .har + Coverage-*.json + cwv.json (optionnel)</text><path d="M603.0439,291.9961 L603.0439,308.3066 L583.0439,312.3066 L603.0439,316.3066 L603.0439,332.6172 A0,0 0 0 0 603.0439,332.6172 L933.1558,332.6172 A0,0 0 0 0 933.1558,332.6172 L933.1558,301.9961 L923.1558,291.9961 L603.0439,291.9961 A0,0 0 0 0 603.0439,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M923.1558,291.9961 L923.1558,301.9961 L933.1558,301.9961 L923.1558,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4878" x="609.0439" y="309.5645">&#9989; Wave 0 termin&#233;e &#8212; fichiers pr&#234;ts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.1118" x="609.0439" y="324.875">Les dispatches suivants lisent les fichiers disque.</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="195.0898" x="387.9541" y="288.1738"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.0898" x="397.9541" y="309.7754">V&#233;rifier existence + taille HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.998" x="397.9541" y="323.9082">(lecture s&#233;lective si &gt; 5 Mo)</text><rect fill="#ECECF2" height="233.5508" style="stroke:#5BA1BC;stroke-width:1.5;" width="891.6279" x="197.123" y="358.4395"/><path d="M595.1992,358.4395 L595.1992,367.9277 L585.1992,377.9277 L197.123,377.9277" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="193.1836" x="200.123" y="372.9746">Wave 1 &#8212; HAR + Coverage</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.4629" x="397.7363" y="372.9746">(2 sous-agents en parall&#232;le)</text><path d="M783.875,451.8379 L783.875,523.0801 L1078.751,523.0801 L1078.751,461.8379 L1068.751,451.8379 L783.875,451.8379" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1068.751,451.8379 L1068.751,461.8379 L1078.751,461.8379 L1068.751,451.8379" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.2856" x="789.875" y="469.4063">Condition de r&#233;ussite :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.876" x="789.875" y="484.7168">har-analysis.json et coverage-analysis.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.1172" x="789.875" y="500.0273">doivent exister avec donn&#233;es valides.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.6201" x="789.875" y="515.3379">Sinon : relancer le dispatch une fois.</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="556.752" x="207.123" y="394.9277"/><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.7773" x="221.123" y="435.0605"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.8828" x="231.123" y="456.6621">Dispatch A &#8212; Analyse HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7031" x="231.123" y="470.7949">(20_analyse-har.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.2871" x="231.123" y="484.9277">python3 analyze_har.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.3711" x="231.123" y="499.0605">Trafic + performance (requ&#234;tes, domaines,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.7773" x="231.123" y="513.1934">codes HTTP, doublons, ressources bloquantes)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="231.123" y="527.3262">-&gt; har-analysis.json</text><rect fill="#E0F0F4" height="133.0625" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="207.9746" x="541.9004" y="420.9277"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.0957" x="551.9004" y="442.5293">Dispatch B &#8212; Analyse Coverage</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.8379" x="551.9004" y="456.6621">(30_analyse-coverage.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.9531" x="551.9004" y="470.7949">Format A ou B d&#233;tect&#233;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.2363" x="551.9004" y="484.9277">M&#233;triques JS/CSS par page</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.5215" x="551.9004" y="499.0605">(total Ko, inutilis&#233; Ko, %)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.918" x="551.9004" y="513.1934">Top 5 JS + Top 3 CSS inutilis&#233;s</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.9746" x="551.9004" y="527.3262">Synth&#232;se multi-pages + outliers</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.8672" x="551.9004" y="541.459">-&gt; coverage-analysis.json</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="556.752" x="207.123" y="573.9902"/><rect fill="#ECECF2" height="756.0454" style="stroke:#5BA1BC;stroke-width:1.5;" width="1070.4634" x="11" y="601.9902"/><path d="M257.7832,601.9902 L257.7832,611.4785 L247.7832,621.4785 L11,621.4785" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="100.6182" x="14" y="616.5254">Merge + suite</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7354" x="119.0479" y="616.5254">(contexte principal)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="296.4336" x="337.2822" y="638.4785"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.4336" x="347.2822" y="660.0801">Lire har-analysis.json + coverage-analysis.json</text><path d="M618.8232,688.1895 L618.8232,719.8105 L598.8232,723.8105 L618.8232,727.8105 L618.8232,759.4316 A0,0 0 0 0 618.8232,759.4316 L857.6748,759.4316 A0,0 0 0 0 857.6748,759.4316 L857.6748,698.1895 L847.6748,688.1895 L618.8232,688.1895 A0,0 0 0 0 618.8232,688.1895" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M847.6748,688.1895 L847.6748,698.1895 L857.6748,698.1895 L847.6748,688.1895" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.5425" x="624.8232" y="705.7578">Limites :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4575" x="624.8232" y="721.0684">DOM=0 si HAR sans corps HTML</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8516" x="624.8232" y="736.3789">SPA : DOM = &#233;tat initial seulement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.8418" x="624.8232" y="751.6895">-&gt; document&#233; dans le rapport</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="226.6484" x="372.1748" y="692.6113"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0469" x="382.1748" y="714.2129">&#201;tape 35 &#8212; har_metrics.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.7617" x="382.1748" y="728.3457">Calcul score/grade A-G par page</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.6484" x="382.1748" y="742.4785">(formule officielle cnumr/ecoindex)</text><polygon fill="#E0F0F4" points="79.1584,779.4316,176.8103,779.4316,188.8103,791.4316,176.8103,803.4316,79.1584,803.4316,67.1584,791.4316,79.1584,779.4316" style="stroke:#5BA1BC;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.7632" x="131.9844" y="814.0664">oui</text><text fill="#1C2856" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="97.6519" x="79.1584" y="795.5889">cwv.json pr&#233;sent ?</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="213.9688" x="21" y="836.3867"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.9688" x="31" y="857.9883">&#201;tape 37 &#8212; collecte CWV skipp&#233;e</text><polygon fill="#E0F0F4" points="338.2039,779.4316,498.0852,779.4316,510.0852,791.4316,498.0852,803.4316,338.2039,803.4316,326.2039,791.4316,338.2039,779.4316" style="stroke:#5BA1BC;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="102.0024" x="422.1445" y="814.0664">oui, voie prioritaire</text><text fill="#1C2856" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.8813" x="338.2039" y="795.5889">GOOGLE_API_KEY disponible ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="51.2832" x="510.0852" y="789.1113">non, repli</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="326.3516" x="254.9688" y="836.3867"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.9395" x="264.9688" y="857.9883">collect_cwv_pagespeed.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.3555" x="264.9688" y="872.1211">PageSpeed Insights API</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9375" x="264.9688" y="886.2539">(CrUX terrain + Lighthouse lab, par page)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="306.3516" x="264.9688" y="900.3867">-&gt; cwv.json {lcp, inp, cls, source: "pagespeed/crux"}</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="348.6777" x="601.3203" y="818.6704"/><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.6777" x="615.3203" y="844.6704"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.5898" x="625.3203" y="866.272">run_lighthouse.sh</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.4473" x="625.3203" y="880.4048">Extraire URLs du HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.1992" x="625.3203" y="894.5376">Lighthouse CLI par page (mode lab)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.6777" x="625.3203" y="908.6704">-&gt; cwv.json {lcp, inp, cls, source: "lighthouse"}</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="348.6777" x="601.3203" y="941.2017"/><path d="M677.748,980.4243 L677.748,1042.6665 L657.748,1046.6665 L677.748,1050.6665 L677.748,1112.9087 A0,0 0 0 0 677.748,1112.9087 L1071.4634,1112.9087 A0,0 0 0 0 1071.4634,1112.9087 L1071.4634,990.4243 L1061.4634,980.4243 L677.748,980.4243 A0,0 0 0 0 677.748,980.4243" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1061.4634,980.4243 L1061.4634,990.4243 L1071.4634,990.4243 L1061.4634,980.4243" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.3052" x="683.748" y="997.9927">ARR&#202;T ICI, rien n'est automatique apr&#232;s :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6821" x="683.748" y="1013.3032">generate_questionnaire.py / parse_questionnaire.py /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.0615" x="683.748" y="1028.6138">fusionner_lots.py sont des &#233;tapes manuelles assum&#233;es</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.0439" x="683.748" y="1043.9243">(d&#233;cision de mission), jamais d&#233;clench&#233;es par ce skill.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.1611" x="683.748" y="1059.2349">Pi&#232;ge : ne jamais relancer run_eof.py seul apr&#232;s une</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.7153" x="683.748" y="1074.5454">relecture de questionnaire (&#233;crase les r&#233;ponses en silence).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.6563" x="683.748" y="1089.856">Toujours parse_questionnaire.py -&gt; fusionner_lots.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.1685" x="683.748" y="1105.1665">-&gt; generate_report_html.py.</text><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="344.498" x="313.25" y="987.2017"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="132.3164" x="323.25" y="1008.8032">&#201;tape 39 &#8212; run_eof.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="279.2813" x="323.25" y="1022.936">(+ extracteurs annexes : parse_html_criteria.py,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.0293" x="323.25" y="1037.0688">analyze_security_headers.py, scan_wellknown.py)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.4043" x="323.25" y="1051.2017">Confronte les donn&#233;es d&#233;j&#224; collect&#233;es &#224;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="324.498" x="323.25" y="1065.3345">eof-referentiel.json (54 crit&#232;res + 16 diagnostic rapide)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.4805" x="323.25" y="1079.4673">-&gt; eof-audit-results.json, eof-rempli.md,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0234" x="323.25" y="1093.6001">eof-radar-&lt;domaine&gt;.svg</text><rect fill="#E0F0F4" height="147.1953" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="341.9141" x="314.542" y="1132.9087"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.5801" x="324.542" y="1154.5103">&#201;tape 40 &#8212; generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.7637" x="324.542" y="1168.6431">Sections : Recommandations P1/P2/P3,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.6348" x="324.542" y="1182.7759">Bonnes pratiques GreenIT, CWV (si cwv.json),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.9141" x="324.542" y="1196.9087">e-footprint CO2e (si efootprint-synthese-python.json),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.3984" x="324.542" y="1211.0415">Potentiel d'optimisation EOF (si eof-audit-results.json,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.791" x="324.542" y="1225.1743">mesur&#233; + questionnaire fusionn&#233;),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.168" x="324.542" y="1239.3071">Annexes (EcoIndex, Trafic, Code mort)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.5059" x="324.542" y="1253.4399">-&gt; rapport-parcours-YYYY-MM-DD.html</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="286.2832" x="324.542" y="1267.5728">(check_valeurs_rapport.py interne, non bloquant)</text><path d="M616.5557,1290.104 L616.5557,1314.0698 L596.5557,1318.0698 L616.5557,1322.0698 L616.5557,1346.0356 A0,0 0 0 0 616.5557,1346.0356 L994.0083,1346.0356 A0,0 0 0 0 994.0083,1346.0356 L994.0083,1300.104 L984.0083,1290.104 L616.5557,1290.104 A0,0 0 0 0 616.5557,1290.104" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M984.0083,1290.104 L984.0083,1300.104 L994.0083,1300.104 L984.0083,1290.104" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.98" x="622.5557" y="1307.6724">Section CO2e conditionnelle :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.4526" x="622.5557" y="1322.9829">affich&#233;e uniquement si efootprint-synthese-python.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2529" x="622.5557" y="1338.2935">pr&#233;sent dans le dossier-audit</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="222.1133" x="374.4424" y="1301.0034"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1133" x="384.4424" y="1322.605">livrer chemin rapport &#224; l'utilisateur</text><rect fill="#C8E6C9" height="546.8789" style="stroke:#5BA1BC;stroke-width:1.5;" width="806.002" x="48.3057" y="1368.0356"/><path d="M447.9473,1368.0356 L447.9473,1377.5239 L437.9473,1387.5239 L48.3057,1387.5239" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="268.9805" x="51.3057" y="1382.5708">&#201;tape optionnelle - e-footprint CO2e</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.2314" x="324.7158" y="1382.5708">(skill /efootprint)</text><polygon fill="#E0F0F4" points="407.2153,1404.5239,563.7827,1404.5239,575.7827,1416.5239,563.7827,1428.5239,407.2153,1428.5239,395.2153,1416.5239,407.2153,1404.5239" style="stroke:#5BA1BC;stroke-width:0.5;"/><text fill="#1C2856" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="156.5674" x="407.2153" y="1420.6812">Utilisateur lance /efootprint ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.7632" x="378.4521" y="1414.2036">oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="20.4102" x="575.7827" y="1414.2036">non</text><path d="M355.3164,1455.8901 L355.3164,1479.856 L335.3164,1483.856 L355.3164,1487.856 L355.3164,1511.8218 A0,0 0 0 0 355.3164,1511.8218 L561.5664,1511.8218 A0,0 0 0 0 561.5664,1511.8218 L561.5664,1465.8901 L551.5664,1455.8901 L355.3164,1455.8901 A0,0 0 0 0 355.3164,1455.8901" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M551.5664,1455.8901 L551.5664,1465.8901 L561.5664,1465.8901 L551.5664,1455.8901" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="82.7544" x="361.3164" y="1473.4585">Mode cache :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.188" x="361.3164" y="1488.769">Si env-data.json existe d&#233;j&#224;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.25" x="361.3164" y="1504.0796">skip API calls (sauf --refresh)</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="219.8398" x="115.4766" y="1438.5239"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.6621" x="125.4766" y="1460.1255">E1 - collect_env_data.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.5156" x="125.4766" y="1474.2583">Extraction HAR (poids, dur&#233;e, IP)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="174.4863" x="125.4766" y="1488.3911">API ipinfo.io (pays + provider)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="199.8398" x="125.4766" y="1502.5239">CrUX (mix device desktop/mobile)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.2441" x="125.4766" y="1516.6567">-&gt; env-data.json</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="281.8555" x="84.4688" y="1549.188"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.4141" x="94.4688" y="1570.7896">E2 - AskUserQuestion</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.5879" x="94.4688" y="1584.9224">- Trafic annuel (visites/an) [REQUIS]</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.8555" x="94.4688" y="1599.0552">- Instance cloud (si AWS/Azure/GCP d&#233;tect&#233;)</text><path d="M402.