<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="2174px" preserveAspectRatio="none" style="width:1947px;height:2174px;background:#FFFFFF;" version="1.1" viewBox="0 0 1947 2174" width="1947px" zoomAndPan="magnify"><title>M&#233;canisme DISPATCH &#8212; Flux des vagues d'analyse de parcours</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="459.1221" x="742.6782" y="33.5352">M&#233;canisme DISPATCH &#8212; Flux des vagues d'analyse de parcours</text></g><ellipse cx="770.7793" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M935.7559,77.4883 L935.7559,101.4541 L915.7559,105.4541 L935.7559,109.4541 L935.7559,133.4199 A0,0 0 0 0 935.7559,133.4199 L1259.6279,133.4199 A0,0 0 0 0 1259.6279,133.4199 L1259.6279,87.4883 L1249.6279,77.4883 L935.7559,77.4883 A0,0 0 0 0 935.7559,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1249.6279,77.4883 L1249.6279,87.4883 L1259.6279,87.4883 L1249.6279,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.4448" x="941.7559" y="95.0566">D&#233;tection plateforme :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.8721" x="941.7559" y="110.3672">- Claude Code -&gt; sous-agents isol&#233;s (parall&#232;le)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="259.5938" x="941.7559" y="125.6777">- Autres -&gt; ex&#233;cution s&#233;quentielle inline</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="289.9531" x="625.8027" y="88.3877"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="269.9531" x="635.8027" y="109.9893">SKILL.md -&gt; lit 25_dispatch-orchestration.md</text><rect fill="#ECECF2" height="205.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="640.5034" x="587.9326" y="143.4199"/><path d="M894.9473,143.4199 L894.9473,152.9082 L884.9473,162.9082 L587.9326,162.9082" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160.8496" x="590.9326" y="157.9551">Wave 0 &#8212; Localisation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7354" x="756.2119" y="157.9551">(contexte principal)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="232.2441" x="654.6572" y="179.9082"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.2441" x="664.6572" y="201.5098">Lire args : dossier ou fichiers directs</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="345.6934" x="597.9326" y="234.041"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="325.6934" x="607.9326" y="255.6426">Identifier .har + Coverage-*.json + cwv.json (optionnel)</text><path d="M888.3242,291.9961 L888.3242,308.3066 L868.3242,312.3066 L888.3242,316.3066 L888.3242,332.6172 A0,0 0 0 0 888.3242,332.6172 L1218.436,332.6172 A0,0 0 0 0 1218.436,332.6172 L1218.436,301.9961 L1208.436,291.9961 L888.3242,291.9961 A0,0 0 0 0 888.3242,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1208.436,291.9961 L1208.436,301.9961 L1218.436,301.9961 L1208.436,291.9961" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.4878" x="894.3242" y="309.5645">&#9989; Wave 0 termin&#233;e &#8212; fichiers pr&#234;ts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="309.1118" x="894.3242" y="324.875">Les dispatches suivants lisent les fichiers disque.</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="195.0898" x="673.2344" y="288.1738"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="175.0898" x="683.2344" y="309.7754">V&#233;rifier existence + taille HAR</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="160.998" x="683.2344" y="323.9082">(lecture s&#233;lective si &gt; 5 Mo)</text><rect fill="#ECECF2" height="233.5508" style="stroke:#5BA1BC;stroke-width:1.5;" width="1925.4785" x="11" y="358.4395"/><path d="M626.2744,358.4395 L626.2744,367.9277 L616.2744,377.9277 L11,377.9277" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="410.3818" x="14" y="372.9746">Wave 1 &#8212; HAR + Coverage + CWV + env-data + S&#233;curit&#233;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.4629" x="428.8115" y="372.9746">(5 sous-agents en parall&#232;le)</text><path d="M1538.5586,405.9063 L1538.5586,569.0117 L1926.4785,569.0117 L1926.4785,415.9063 L1916.4785,405.9063 L1538.5586,405.9063" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1916.4785,405.9063 L1916.4785,415.9063 L1926.4785,415.9063 L1916.4785,405.9063" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.563" x="1544.5586" y="423.4746">Ind&#233;pendance v&#233;rifi&#233;e en code, pas suppos&#233;e :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312.6538" x="1544.5586" y="438.7852">analyse-har et extracteur-security-headers lisent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.0757" x="1544.5586" y="454.0957">AUSSI env-data.json, mais en d&#233;gradation DOUCE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.5869" x="1544.5586" y="469.4063">(fichier absent -&gt; classification moins pr&#233;cise /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="250.9165" x="1544.5586" y="484.7168">filtre de pages ignor&#233;, jamais un crash).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="143.2856" x="1544.5586" y="500.0273">Condition de r&#233;ussite :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.0371" x="1544.5586" y="515.3379">har-analysis.json ET coverage-analysis.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.1377" x="1544.5586" y="530.6484">obligatoires (avertissement bloquant si absents).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="366.9199" x="1544.5586" y="545.959">cwv.json / env-data.json / security-headers-analysis.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.083" x="1544.5586" y="561.2695">best-effort (absence signal&#233;e, jamais bloquante).</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="1507.5586" x="21" y="394.9277"/><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.7773" x="33" y="435.0605"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123.8027" x="43" y="456.6621">Dispatch analyse-har</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7031" x="43" y="470.7949">(20_analyse-har.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.2871" x="43" y="484.9277">python3 analyze_har.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.3711" x="43" y="499.0605">Trafic + performance (requ&#234;tes, domaines,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.7773" x="43" y="513.1934">codes HTTP, doublons, ressources bloquantes)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.7324" x="43" y="527.3262">-&gt; har-analysis.json</text><rect fill="#E0F0F4" height="133.0625" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="207.9746" x="345.7773" y="420.9277"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.9375" x="355.7773" y="442.5293">Dispatch analyse-coverage</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.8379" x="355.7773" y="456.6621">(30_analyse-coverage.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.9531" x="355.7773" y="470.7949">Format A ou B d&#233;tect&#233;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.2363" x="355.7773" y="484.9277">M&#233;triques JS/CSS par page</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="141.5215" x="355.7773" y="499.0605">(total Ko, inutilis&#233; Ko, %)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="179.918" x="355.7773" y="513.1934">Top 5 JS + Top 3 CSS inutilis&#233;s</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.9746" x="355.7773" y="527.3262">Synth&#232;se multi-pages + outliers</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="153.8672" x="355.7773" y="541.459">-&gt; coverage-analysis.json</text><rect fill="#E0F0F4" height="133.0625" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="325.2383" x="581.752" y="420.9277"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.6406" x="591.752" y="442.5293">Dispatch collecte-cwv</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.957" x="591.752" y="456.6621">(37_lighthouse.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="247.3477" x="591.752" y="470.7949">collect_cwv_pagespeed.py --strategy both</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.9277" x="591.752" y="484.9277">PageSpeed Insights + CrUX (mobile+desktop,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.2441" x="591.752" y="499.0605">accessibility/best-practices inclus d&#232;s le</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.6895" x="591.752" y="513.1934">d&#233;part) ; fallback Lighthouse auto si</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="305.2383" x="591.752" y="527.3262">GOOGLE_API_KEY absente ou 0 m&#233;trique exploitable</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="70.2656" x="591.752" y="541.459">-&gt; cwv.json</text><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="257.668" x="934.9902" y="427.9941"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.6191" x="944.9902" y="449.5957">Dispatch collecte-env-data</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="168.1523" x="944.9902" y="463.7285">(45_efootprint.md, &#201;tape 20)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="223.752" x="944.9902" y="477.8613">collect_env_data.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="210.5273" x="944.9902" y="491.9941">HAR + CrUX (mix device) + ipinfo.io</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="237.668" x="944.9902" y="506.127">(pays/provider) + API interne SimilarWeb</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="107.3848" x="944.9902" y="520.2598">(mix pays + trafic)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="101.2441" x="944.9902" y="534.3926">-&gt; env-data.json</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="295.9004" x="1220.6582" y="435.0605"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.8262" x="1230.6582" y="456.6621">Dispatch extracteur-security-headers</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.5293" x="1230.6582" y="470.7949">(39_eof-audit.md)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="275.9004" x="1230.6582" y="484.9277">analyze_security_headers.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.2285" x="1230.6582" y="499.0605">Score s&#233;curit&#233; local depuis les en-t&#234;tes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.248" x="1230.6582" y="513.1934">d&#233;j&#224; dans le .har, aucun appel r&#233;seau</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.25" x="1230.6582" y="527.3262">-&gt; security-headers-analysis.json</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="1507.5586" x="21" y="573.9902"/><rect fill="#ECECF2" height="219.418" style="stroke:#5BA1BC;stroke-width:1.5;" width="1075.4883" x="434.418" y="601.9902"/><path d="M1034.7559,601.9902 L1034.7559,611.4785 L1024.7559,621.4785 L434.418,621.4785" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="395.4453" x="437.418" y="616.5254">Wave 2 &#8212; Extracteurs EOF d&#233;pendants d'env-data.json</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="190.4629" x="837.293" y="616.5254">(2 sous-agents en parall&#232;le)</text><path d="M1117.1406,665.3564 L1117.1406,782.5303 L1499.9063,782.5303 L1499.9063,675.3564 L1489.9063,665.3564 L1117.1406,665.3564" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1489.9063,665.3564 L1489.9063,675.3564 L1499.9063,675.3564 L1489.9063,665.3564" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.6172" x="1123.1406" y="682.9248">D&#201;PENDANCE DURE (pas une d&#233;gradation), v&#233;rifi&#233;e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.4634" x="1123.1406" y="698.2354">ligne par ligne dans le code :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.3306" x="1123.1406" y="713.5459">parse_html_criteria.py et scan_wellknown.py font</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.417" x="1123.1406" y="728.8564">sys.exit(1) si env-data.json est absent ou vide.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.7793" x="1123.1406" y="744.167">Ne jamais dispatcher cette vague avant d'avoir</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="352.3457" x="1123.1406" y="759.4775">confirm&#233; env-data.json sur disque (Wave 1 termin&#233;e) &#8212;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="361.7656" x="1123.1406" y="774.7881">un simple retry ne compense pas cette d&#233;pendance dure.</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="652.7227" x="444.418" y="638.4785"/><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="278.3223" x="458.418" y="664.4785"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="173.2559" x="468.418" y="686.0801">Dispatch extracteur-html-css</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.9023" x="468.418" y="700.2129">depends_on="collecte-env-data"</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.543" x="468.418" y="714.3457">parse_html_criteria.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.623" x="468.418" y="728.4785">Re-fetch live des pages d&#233;j&#224; audit&#233;es</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="258.3223" x="468.418" y="742.6113">(le .har ne contient pas les corps HTML/CSS)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.8984" x="468.418" y="756.7441">Archive sous pages-html/ (chantier 27)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.2422" x="468.418" y="770.877">-&gt; html-css-criteria.json</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="318.4004" x="764.7402" y="671.5449"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="182.7188" x="774.7402" y="693.1465">Dispatch extracteur-wellknown</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.9023" x="774.7402" y="707.2793">depends_on="collecte-env-data"</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.0703" x="774.7402" y="721.4121">scan_wellknown.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="219.6328" x="774.7402" y="735.5449">Fetch direct security.txt / robots.txt /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="298.4004" x="774.7402" y="749.6777">sitemap.xml sur le domaine d&#233;duit d'env-data.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.3379" x="774.7402" y="763.8105">-&gt; wellknown-scan.json</text><rect fill="#5BA1BC" height="6" rx="2.5" ry="2.5" style="stroke:#5BA1BC;stroke-width:1;" width="652.7227" x="444.418" y="803.4082"/><rect fill="#ECECF2" height="733.4365" style="stroke:#5BA1BC;stroke-width:1.5;" width="784.4097" x="583.3184" y="831.4082"/><path d="M830.1016,831.4082 L830.1016,840.8965 L820.1016,850.8965 L583.3184,850.8965" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="100.6182" x="586.3184" y="845.9434">Merge + suite</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7354" x="691.3662" y="845.9434">(contexte principal)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="351.9102" x="594.8242" y="867.8965"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="276.4336" x="604.8242" y="889.498">Lire har-analysis.json + coverage-analysis.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.877" x="604.8242" y="903.6309">(obligatoires) + cwv.json / env-data.json /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="331.9102" x="604.8242" y="917.7637">security-headers-analysis.json / html-css-criteria.json /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.375" x="604.8242" y="931.8965">wellknown-scan.json (best-effort, Wave 1/2)</text><path d="M904.209,964.4277 L904.209,1066.291 L1165.3345,1066.291 L1165.3345,974.4277 L1155.3345,964.4277 L904.209,964.4277" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1155.3345,964.4277 L1155.3345,974.4277 L1165.3345,974.4277 L1155.3345,964.4277" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="53.5425" x="910.209" y="981.9961">Limites :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.4575" x="910.209" y="997.3066">DOM=0 si HAR sans corps HTML</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8516" x="910.209" y="1012.6172">SPA : DOM = &#233;tat initial seulement</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.8418" x="910.209" y="1027.9277">-&gt; document&#233; dans le rapport</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.6748" x="910.209" y="1043.2383">Aucun OUTPUT_FILE r&#233;utilis&#233; ailleurs :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.1255" x="910.209" y="1058.5488">validation console libre, hors dispatch</text><path d="M894.1035,1086.291 L894.1035,1142.2227 L1175.4399,1142.2227 L1175.4399,1096.291 L1165.4399,1086.291 L894.1035,1086.291" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1165.4399,1086.291 L1165.4399,1096.291 L1175.4399,1096.291 L1165.4399,1086.291" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.1064" x="900.1035" y="1103.8594">Si cwv.json absent (Wave 1 en &#233;chec) :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="260.3364" x="900.1035" y="1119.1699">rapport sans CWV, onLoad du HAR utilis&#233;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.1133" x="900.1035" y="1134.4805">comme proxy du LCP</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="226.6484" x="657.4551" y="1022.126"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0469" x="667.4551" y="1043.7275">&#201;tape 35 &#8212; har_metrics.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.7617" x="667.4551" y="1057.8604">Calcul score/grade A-G par page</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.6484" x="667.4551" y="1071.9932">(formule officielle cnumr/ecoindex)</text><path d="M968.2402,1171.9229 L968.2402,1241.8203 L948.2402,1245.8203 L968.2402,1249.8203 L968.2402,1319.7178 A0,0 0 0 0 968.2402,1319.7178 L1357.728,1319.7178 A0,0 0 0 0 1357.728,1319.7178 L1357.728,1181.9229 L1347.728,1171.9229 L968.2402,1171.9229 A0,0 0 0 0 968.2402,1171.9229" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1347.728,1171.9229 L1347.728,1181.9229 L1357.728,1181.9229 L1347.728,1171.9229" fill="#FFECB3" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.3052" x="974.2402" y="1189.4912">ARR&#202;T ICI, rien n'est automatique apr&#232;s :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.6821" x="974.2402" y="1204.8018">generate_questionnaire.py / parse_questionnaire.py /</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.0615" x="974.2402" y="1220.1123">fusionner_lots.py sont des &#233;tapes manuelles assum&#233;es</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.0439" x="974.2402" y="1235.4229">(d&#233;cision de mission), jamais d&#233;clench&#233;es par ce skill.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="328.1611" x="974.2402" y="1250.7334">Pi&#232;ge : ne jamais relancer run_eof.py seul apr&#232;s une</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="368.4878" x="974.2402" y="1266.0439">relecture de questionnaire (&#233;crase les r&#233;ponses en silence,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.7876" x="974.2402" y="1281.3545">il ne relit jamais lots/relecture-questionnaire.json).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.6563" x="974.2402" y="1296.665">Toujours parse_questionnaire.py -&gt; fusionner_lots.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.1685" x="974.2402" y="1311.9756">-&gt; generate_report_html.py.</text><rect fill="#E0F0F4" height="147.1953" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="354.9219" x="593.3184" y="1172.2227"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="243.0352" x="603.3184" y="1193.8242">&#201;tape 39 &#8212; run_eof.py &lt;dossier-source&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="310.1602" x="603.3184" y="1207.957">Confronte har-analysis.json / coverage-analysis.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.877" x="603.3184" y="1222.0898">(obligatoires) + cwv.json / env-data.json /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="331.9102" x="603.3184" y="1236.2227">security-headers-analysis.json / html-css-criteria.json /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.5254" x="603.3184" y="1250.3555">wellknown-scan.json (best-effort, d&#233;j&#224; produits par</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="301.6523" x="603.3184" y="1264.4883">Wave 1/2 &#8212; plus d'extracteurs annexes &#224; lancer ici)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="334.9219" x="603.3184" y="1278.6211">&#224; eof-referentiel.json (54 crit&#232;res + 16 diagnostic rapide)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.4805" x="603.3184" y="1292.7539">-&gt; eof-audit-results.json, eof-rempli.md,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="156.0234" x="603.3184" y="1306.8867">eof-radar-&lt;domaine&gt;.svg</text><rect fill="#E0F0F4" height="147.1953" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="341.9141" x="599.8223" y="1339.7178"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.5801" x="609.8223" y="1361.3193">&#201;tape 40 &#8212; generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.7637" x="609.8223" y="1375.4521">Sections : Recommandations P1/P2/P3,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.6348" x="609.8223" y="1389.585">Bonnes pratiques GreenIT, CWV (si cwv.json),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="321.9141" x="609.8223" y="1403.7178">e-footprint CO2e (si efootprint-synthese-python.json),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="318.3984" x="609.8223" y="1417.8506">Potentiel d'optimisation EOF (si eof-audit-results.json,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.791" x="609.8223" y="1431.9834">mesur&#233; + questionnaire fusionn&#233;),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.168" x="609.8223" y="1446.1162">Annexes (EcoIndex, Trafic, Code mort)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.5059" x="609.8223" y="1460.249">-&gt; rapport-parcours-YYYY-MM-DD.html</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="286.2832" x="609.8223" y="1474.3818">(check_valeurs_rapport.py interne, non bloquant)</text><path d="M901.8359,1496.9131 L901.8359,1520.8789 L881.8359,1524.8789 L901.8359,1528.8789 L901.8359,1552.8447 A0,0 0 0 0 901.8359,1552.8447 L1279.2886,1552.8447 A0,0 0 0 0 1279.2886,1552.8447 L1279.2886,1506.9131 L1269.2886,1496.9131 L901.8359,1496.9131 A0,0 0 0 0 901.8359,1496.9131" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M1269.2886,1496.9131 L1269.2886,1506.9131 L1279.2886,1506.9131 L1269.2886,1496.9131" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.98" x="907.8359" y="1514.4814">Section CO2e conditionnelle :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="356.4526" x="907.8359" y="1529.792">affich&#233;e uniquement si efootprint-synthese-python.json</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.2529" x="907.8359" y="1545.1025">pr&#233;sent dans le dossier-audit</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="222.1133" x="659.7227" y="1507.8125"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="202.1133" x="669.7227" y="1529.4141">livrer chemin rapport &#224; l'utilisateur</text><rect fill="#C8E6C9" height="546.8789" style="stroke:#5BA1BC;stroke-width:1.5;" width="816.6309" x="332.2715" y="1574.8447"/><path d="M731.9131,1574.8447 L731.9131,1584.333 L721.9131,1594.333 L332.2715,1594.333" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="268.9805" x="335.2715" y="1589.3799">&#201;tape optionnelle - e-footprint CO2e</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="116.2314" x="608.6816" y="1589