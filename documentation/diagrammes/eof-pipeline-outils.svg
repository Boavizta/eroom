<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:707px;height:965px;background:#FFFFFF;" width="707px" height="965px" viewBox="0 0 707 965" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="136.06" y="33.535" fill="#000" font-size="14" textLength="433.494" font-weight="700">EOF skill (EROOM Optimization Framework) — Tool pipeline</text></g><ellipse cx="194.191" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><path d="M359.81,88.066 L359.81,119.688 L339.81,123.688 L359.81,127.688 L359.81,159.309 A0,0 0 0 0 359.81,159.309 L686.614,159.309 A0,0 0 0 0 686.614,159.309 L686.614,98.066 L676.614,88.066 L359.81,88.066 A0,0 0 0 0 359.81,88.066" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#E0F0F4"/><path d="M676.614,88.066 L676.614,98.066 L686.614,98.066 L676.614,88.066" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#E0F0F4"/><text x="365.81" y="105.635" fill="#000" font-size="13" textLength="230.458">Classic export endpoints (CSV/XLSX)</text><text x="365.81" y="120.945" fill="#000" font-size="13" textLength="165.299">fail here: 307 redirect to a</text><text x="365.81" y="136.256" fill="#000" font-size="13" textLength="305.805">single-use signed URL, invalid in a separate call.</text><text x="365.81" y="151.566" fill="#000" font-size="13" textLength="276.758">Only the gviz path works, one tab at a time.</text><rect x="48.573" y="92.488" width="291.236" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="58.573" y="114.09" fill="#1C2856" font-size="12" textLength="174.668">Source — public Google Sheet</text><text x="58.573" y="128.223" fill="#1C2856" font-size="12" textLength="271.236">"EOF-V.1.1 (EROOM Optimization Framework)"</text><text x="58.573" y="142.355" fill="#1C2856" font-size="12" textLength="119.063">9 tabs, 1 gid per tab</text><rect x="62.277" y="169.309" width="584.055" height="125.02" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M355.6,169.309 L355.6,178.797 L345.6,188.797 L62.277,188.797" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="65.277" y="183.844" fill="#000" font-size="14" textLength="139.446" font-weight="700">Block 1 — Retrieval</text><text x="209.153" y="183.844" fill="#000" font-size="14" textLength="139.446">(9 calls, one per tab)</text><path d="M336.105,208.441 L336.105,240.063 L316.105,244.063 L336.105,248.063 L336.105,279.684 A0,0 0 0 0 336.105,279.684 L636.333,279.684 A0,0 0 0 0 636.333,279.684 L636.333,218.441 L626.333,208.441 L336.105,208.441 A0,0 0 0 0 336.105,208.441" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#C8E6C9"/><path d="M626.333,208.441 L626.333,218.441 L636.333,218.441 L626.333,208.441" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#C8E6C9"/><text x="342.105" y="226.01" fill="#000" font-size="13" textLength="275.526">"f" field (formatted) preferred over "v" (raw):</text><text x="342.105" y="241.32" fill="#000" font-size="13" textLength="238.558">works around a formatting bug of the</text><text x="342.105" y="256.631" fill="#000" font-size="13" textLength="228.217">source Sheet (criterion IDs stored as</text><text x="342.105" y="271.941" fill="#000" font-size="13" textLength="279.227">dates on 3 tabs, ex. 3.1 -> Date(2025,0,3)).</text><rect x="72.277" y="205.797" width="243.828" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.277" y="227.398" fill="#1C2856" font-size="12" textLength="223.828">curl gviz/tq?tqx=out:json&amp;gid=&lt;gid></text><text x="82.277" y="241.531" fill="#1C2856" font-size="12" textLength="183.469">x9 (TO READ, Quick diagnostic,</text><text x="82.277" y="255.664" fill="#1C2856" font-size="12" textLength="112.998">6 pillars, Synthesis)</text><text x="82.277" y="269.797" fill="#1C2856" font-size="12" textLength="139.729">-> tmp/eof-gviz/*.json</text><rect x="16" y="304.328" width="636.455" height="527.301" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M467.349,304.328 L467.349,313.816 L457.349,323.816 L16,323.816" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="19" y="318.863" fill="#000" font-size="14" textLength="203.841" font-weight="700">Block 2 — build_template.py</text><text x="227.271" y="318.863" fill="#000" font-size="14" textLength="233.078">(deterministic, no LLM calculation)</text><rect x="135.714" y="340.816" width="116.955" height="34.133" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="145.714" y="362.418" fill="#1C2856" font-size="12" textLength="96.955">Parse the 9 JSON</text><rect x="106.666" y="394.949" width="175.051" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="116.666" y="416.551" fill="#1C2856" font-size="12" textLength="150.111">Tab 0 — Quick diagnostic</text><text x="116.666" y="430.684" fill="#1C2856" font-size="12" textLength="144.264">Evaluation = 1 to 5 scale</text><text x="116.666" y="444.816" fill="#1C2856" font-size="12" textLength="155.051">(5 text rungs per criterion)</text><rect x="49.188" y="477.348" width="290.006" height="90.664" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="59.188" y="498.949" fill="#1C2856" font-size="12" textLength="212.947">Tabs 1 to 5 — Product, Architecture,</text><text x="59.188" y="513.082" fill="#1C2856" font-size="12" textLength="211.184">Infrastructure, Storage, Algo &amp; Code</text><text x="59.188" y="527.215" fill="#1C2856" font-size="12" textLength="198.779">Evaluation = 5 categorical choices</text><text x="59.188" y="541.348" fill="#1C2856" font-size="12" textLength="186.996">(Strength / Potential identified /</text><text x="59.188" y="555.48" fill="#1C2856" font-size="12" textLength="270.006">Not applicable / To be assessed / In progress)</text><rect x="85.332" y="588.012" width="217.719" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="95.332" y="609.613" fill="#1C2856" font-size="12" textLength="139.893">Tab 6 — Ease of change</text><text x="95.332" y="623.746" fill="#1C2856" font-size="12" textLength="197.719">Evaluation = 3 DIFFERENT choices</text><text x="95.332" y="637.879" fill="#1C2856" font-size="12" textLength="179.736">(Easy / Moderate effort / Hard)</text><rect x="67.232" y="670.41" width="253.918" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="77.232" y="692.012" fill="#1C2856" font-size="12" textLength="167.766">Inject 3 hyperlinks + 2 logos</text><text x="77.232" y="706.145" fill="#1C2856" font-size="12" textLength="233.918">(retrieved once from the provided Excel,</text><text x="77.232" y="720.277" fill="#1C2856" font-size="12" textLength="199.137">gviz alone does not provide them)</text><path d="M382.383,748.387 L382.383,780.008 L362.383,784.008 L382.383,788.008 L382.383,819.629 A0,0 0 0 0 382.383,819.629 L642.455,819.629 A0,0 0 0 0 642.455,819.629 L642.455,758.387 L632.455,748.387 L382.383,748.387 A0,0 0 0 0 382.383,748.387" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#E0F0F4"/><path d="M632.455,748.387 L632.455,758.387 L642.455,758.387 L632.455,748.387" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#E0F0F4"/><text x="388.383" y="765.955" fill="#000" font-size="13" textLength="135.135">No box is pre-ticked.</text><text x="388.383" y="781.266" fill="#000" font-size="13" textLength="233.702">Only "Impact level" displays the fixed</text><text x="388.383" y="796.576" fill="#000" font-size="13" textLength="239.072">value from the reference (data, not an</text><text x="388.383" y="811.887" fill="#000" font-size="13" textLength="99.703">answer to give).</text><rect x="26" y="752.809" width="336.383" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="774.41" fill="#1C2856" font-size="12" textLength="316.383">Generate the table of contents + the Synthesis section</text><text x="36" y="788.543" fill="#1C2856" font-size="12" textLength="206.074">(score formula documented in text,</text><text x="36" y="802.676" fill="#1C2856" font-size="12" textLength="199.553">no numeric score: blank template)</text><rect x="75.89" y="869.053" width="236.604" height="34.133" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="85.89" y="890.654" fill="#1C2856" font-size="12" textLength="216.604">deliver the blank Markdown template</text><ellipse cx="194.191" cy="934.186" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="194.191" cy="934.186" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="194.191" y1="72.488" x2="194.191" y2="92.488" style="stroke:#5BA1BC;stroke-width:1;"/><polygon points="190.191,82.488,194.191,92.488,198.191,82.488,194.191,86.488" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="194.191" y1="154.887" x2="194.191" y2="205.797" style="stroke:#5BA1BC;stroke-width:1;"/><polygon points="190.191,195.797,194.191,205.797,198.191,195.797,194.191,199.797" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="194.191" y1="374.949" x2="194.191" y2="394.949" style="stroke:#5BA1BC;stroke-width:1;"/><polygon points="190.191,384.949,194.191,394.949,198.191,384.949,194.191,388.949" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="194.191" y1="457.348" x2="194.191" y2="477.348" style="stroke:#5BA1BC;stroke-width:1;"/><polygon points="190.191,467.348,194.191,477.348,198.191,467.348,194.191,471.348" fill="#5BA1BC" style="stroke:#5BA1BC;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/