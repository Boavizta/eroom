><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.1138" x="270.6675" y="1454.2871">S'il ne revient pas, la relecture le dit : elle pose un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345.1348" x="270.6675" y="1469.5977">&#233;tat echec_lecture que le contr&#244;le de sant&#233; des sondes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="340.2471" x="270.6675" y="1484.9082">attrape. Un questionnaire jamais revenu ne ressemble</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.7876" x="270.6675" y="1500.2188">donc plus &#224; un questionnaire rendu vide.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.4663" x="270.6675" y="1515.5293">Suite : page 3/3.</text><?plantuml-src hLRTRXit5hxNKnmu5ze2ikBOTP0AJG5PabqNZjFO4h0N0GgQGzbCA792SfHu5_i0-nQzssgl-mRpOlkTCnfPifDUhG4PqWpF__TzXzbcP-XTPLAsmNjbew79srFQfr_LhQ73vqSqeDjwvUjLD95C9kENuTx47js5cAYqfN7McqudVRI-L54jw4RfZxSnLBuO1HSYFJkLlwqJ-9-jjgNocVxP8JfvR34vE3qu_PxVX5YOk7vwV39ySJB2qzFWy_hPYz7Xg-ENdNzjULSwuyt_t-ymnl1vr-JXvRNvL1clpOMTu-FDrm8yFNs6vCgJKDm_pNGq6PqUVjlahxnVXco-LVgZKzj-VZWP7up7MoVIEkGRanBGC7JsrfCsFfkuTMgXlgmFNDj_03871rileqbbyAbrSM9S-2nzf1mheAQPrTwmAcmsLTmZbMX6pruTZbuWbMsSx8sSgWhptlyDtfqZvPMxJsOVPtIeOlfER4TVjxqrtaILpM-Vjf7UB-_5wEmTFHkVZCUJupQV-j-VAY2RYWfDY4kh4LTnZlLABCxfsUZLvENeXqwXihfHoT1U4LAo9kxBkUToxFHwqzMEHxifB46YMGylWBRXT3gvd9w_lUpJrVdaaiOJ6atmZ7uTdateiZkvdj9mDdtxPZWzVpURzDcaqfKtLA-oukmCkQw48zzL9PW8Bcj3IKTRPX1NTr4jmGAcEYmMoiEa_ftO6WnMPQp_IAIMmKPo5S4wmas8MLmhy1GQyEBvKRzZV45SGQVp-ZMTRVG05ZiTfTUlEvqPxV-4GGneR2JYqsET4Hz1smTKtkUxu8_ecnEY7tSQ-rC7PZ16QmTqmI5Dc3UlzW6sokNK_v22x-106sCKCRW_y9QAUlM1wu_AwxjwbLY9kD05B95MurfiBWtTAYO7Puu24kcDbwHyebYl1Dczznwgg4trPVseg180z3k6j5IkCd5ls-qqeXA96j5Iim2PE2aTWmL1y6FmtdEmjWk9nrMw2Wq0nhToABhg1kJTxiPEv_RHblwY05rU7cvvKvLu-svjnr