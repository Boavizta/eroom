f" font-size="13" lengthAdjust="spacing" textLength="35.8262" x="404.4136" y="655.5547">re&#231;oit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="47.1694" x="314.2705" y="670.8652">environ</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="361.4399" y="670.8652">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.4404" x="365.5532" y="670.8652">55</text></g><path d="M379,688.6074 L379,1034.6074 L918,1034.6074 L918,698.6074 L908,688.6074 L379,688.6074" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M908,688.6074 L908,698.6074 L918,698.6074 L908,688.6074" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="317.5732" x="469.6899" y="706.1758">UN SEUL fichier. Le d&#233;coupage en deux, produit et</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.6865" x="469.6899" y="721.4863">technique, a &#233;t&#233; supprim&#233; : il ne routait rien.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.9844" x="469.6899" y="736.7969">3 destinataires sur 4 recevaient des questions dans</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="110.1064" x="469.6899" y="752.1074">les DEUX fichiers.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="469.6899" y="767.418">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.8369" x="469.6899" y="782.7285">Chaque question dit dans son titre &#224; qui la poser :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324.4541" x="469.6899" y="798.0391">le responsable produit, l'&#233;quipe de d&#233;veloppement,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.0098" x="469.6899" y="813.3496">la personne qui exploite l'infrastructure, celle qui</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.2944" x="469.6899" y="828.6602">g&#232;re les donn&#233;es. C'est une indication, pas un plan de</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="348.8862" x="469.6899" y="843.9707">classement : les r&#244;les d&#233;pendent trop de chaque client.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="469.6899" y="859.2813">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="320.3408" x="469.6899" y="874.5918">L'ordre suit le rendement : un client qui s'arr&#234;te en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.0215" x="469.6899" y="889.9023">cours de route a couvert le maximum de crit&#232;res pour</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="289.9609" x="469.6899" y="905.2129">l'effort fourni. Le rendement se calcule sur les</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="346.4678" x="469.6899" y="920.5234">crit&#232;res RESTANTS, donc un bloc dont la mesure a d&#233;j&#224;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.2378" x="469.6899" y="935.834">tranch&#233; une partie redescend tout seul.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="469.6899" y="951.1445">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="331.6143" x="469.6899" y="966.4551">Format : cases &#224; cocher Markdown, avec des rep&#232;res</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.1509" x="469.6899" y="981.7656">cach&#233;s en commentaire HTML pour que la relecture ne</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207.27" x="469.6899" y="997.0762">d&#233;pende pas de la mise en page.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="301.5645" x="469.6899" y="1012.3867">Une case "Je ne sais pas" est toujours offerte, et</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.2744" x="469.6899" y="1027.6973">elle ne produit jamais de r&#233;ponse.</text><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg9"><polygon fill="#5BA1BC" points="60.3296,1057.75,50.3296,1061.75,60.3296,1065.75,56.3296,1061.75" style="stroke:#5BA1BC;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="54.3296" x2="243.0244" y1="1061.75" y2="1061.75"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.2676" x="90.5129" y="1057.0078">Chemin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="138.7805" y="1057.0078">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="16.25" x="142.8938" y="1057.0078">du</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="159.1438" y="1057.0078">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="39.584" x="163.2571" y="1057.0078">fichier</text></g><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="923.2661" x="