;lai est asynchrone et n'est pas outill&#233;.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="304.7954" x="183.1877" y="1180.25">Rien dans le code ne fixe d'&#233;ch&#233;ance, ne relance</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.645" x="183.1877" y="1195.5605">l'interlocuteur, ni ne suit qui a r&#233;pondu quoi.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.3379" x="183.1877" y="1210.8711">Le transport est libre : courriel, d&#233;p&#244;t partag&#233;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.3345" x="183.1877" y="1226.1816">ce que le client accepte.</text><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg11"><line style="stroke:#5BA1BC;stroke-width:1;" x1="661.6523" x2="703.6523" y1="1290.8555" y2="1290.8555"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="703.6523" x2="703.6523" y1="1290.8555" y2="1303.8555"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="662.6523" x2="703.6523" y1="1303.8555" y2="1303.8555"/><polygon fill="#5BA1BC" points="672.6523,1299.8555,662.6523,1303.8555,672.6523,1307.8555,668.6523,1303.8555" style="stroke:#5BA1BC;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.2686" x="699.9717" y="1255.4922">Cocher</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="744.2402" y="1255.4922">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17.6274" x="748.3535" y="1255.4922">les</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1133" x="765.981" y="1255.4922">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing