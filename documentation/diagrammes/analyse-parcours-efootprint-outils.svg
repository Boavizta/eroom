<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1772px" preserveAspectRatio="none" style="width:903px;height:1772px;background:#FFFFFF;" version="1.1" viewBox="0 0 903 1772" width="903px" zoomAndPan="magnify"><title>Pipeline outils e-footprint (CO2e) &#8212; outils, donn&#233;es, calcul, restitution</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="509.2568" x="195.7783" y="33.5352">Pipeline outils e-footprint (CO2e) &#8212; outils, donn&#233;es, calcul, restitution</text></g><ellipse cx="184.4233" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><path d="M363.1606,77.4883 L363.1606,101.4541 L343.1606,105.4541 L363.1606,109.4541 L363.1606,133.4199 A0,0 0 0 0 363.1606,133.4199 L695.4751,133.4199 A0,0 0 0 0 695.4751,133.4199 L695.4751,87.4883 L685.4751,77.4883 L363.1606,77.4883 A0,0 0 0 0 363.1606,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M685.4751,77.4883 L685.4751,87.4883 L695.4751,87.4883 L685.4751,77.4883" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.3145" x="369.1606" y="95.0566">Sortie : .har (requ&#234;tes, tailles, timings, IP serveur)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="258.6797" x="369.1606" y="110.3672">+ Coverage-*.json (code JS/CSS ex&#233;cut&#233;,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="307.1758" x="369.1606" y="125.6777">parsing effectu&#233; plus tard, hors p&#233;rim&#232;tre CO2e)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="317.4746" x="25.686" y="88.3877"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="297.4746" x="35.686" y="109.9893">Chrome DevTools &#8212; capture manuelle du parcours</text><rect fill="#ECECF2" height="325.0518" style="stroke:#5BA1BC;stroke-width:1.5;" width="653.603" x="17.3735" y="143.4199"/><path d="M443.689,143.4199 L443.689,152.9082 L433.689,162.9082 L17.3735,162.9082" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="191.9941" x="20.3735" y="157.9551">Bloc 1 &#8212; Outils de collecte</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.8916" x="216.7974" y="157.9551">(collect_env_data.py, s&#233;quentiel)</text><path d="M351.4731,288.1738 L351.4731,344.1055 L650.9766,344.1055 L650.9766,298.1738 L640.9766,288.1738 L351.4731,288.1738" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M640.9766,288.1738 L640.9766,298.1738 L650.9766,298.1738 L640.9766,288.1738" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.5034" x="357.4731" y="305.7422">Contrairement au DISPATCH HAR/Coverage,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="248.917" x="357.4731" y="321.0527">ces outils s'ex&#233;cutent l'un apr&#232;s l'autre,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.144" x="357.4731" y="336.3633">pas en parall&#232;le</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="242.6445" x="63.1011" y="179.9082"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.6445" x="73.1011" y="201.5098">1. extract_har_data &#8212; parsing du HAR</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="221.2109" x="73.8179" y="234.041"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.2109" x="83.8179" y="255.6426">2. CrUX (API Google) &#8212; mix device</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="248.2578" x="60.2944" y="299.0732"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.2578" x="70.2944" y="320.6748">3. ipinfo.io &#8212; pays/provider h&#233;bergeur</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="286.4961" x="41.1753" y="368.2061"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="266.4961" x="51.1753" y="389.8076">4. detect_tech.py &#8212; stack techno (~35 r&#232;gles)</text><rect fill="#E0F0F4" height="34.1328" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="314.0996" x="27.3735" y="422.3389"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="294.0996" x="37.3735" y="443.9404">5. similarweb_api.py (optionnel) &#8212; audience/trafic</text><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="615.4316" x="68.2007" y="478.4717"/><path d="M400.4673,478.4717 L400.4673,487.96 L390.4673,497.96 L68.2007,497.96" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="199.7188" x="71.2007" y="493.0068">Bloc 2 &#8212; Donn&#233;es r&#233;colt&#233;es</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="118.1182" x="275.3491" y="493.0068">-&gt; env-data.json</text><path d="M310.646,525.8486 L310.646,542.1592 L290.646,546.1592 L310.646,550.1592 L310.646,566.4697 A0,0 0 0 0 310.646,566.4697 L673.6323,566.4697 A0,0 0 0 0 673.6323,566.4697 L673.6323,535.8486 L663.6323,525.8486 L310.646,525.8486 A0,0 0 0 0 310.646,525.8486" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M663.6323,525.8486 L663.6323,535.8486 L673.6323,535.8486 L663.6323,525.8486" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="341.9863" x="316.646" y="543.417">Param&#232;tres : audience, ios-mobile-share, sw-domain,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.8301" x="316.646" y="558.7275">refresh, check, no-similarweb</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="212.4453" x="78.2007" y="514.96"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="137.2559" x="88.2007" y="536.5615">Poids page, mix device,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="192.4453" x="88.2007" y="550.6943">pays/provider/intensit&#233; carbone,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.4609" x="88.2007" y="564.8271">tech_stack, audience, trafic</text><rect fill="#ECECF2" height="194.1523" style="stroke:#5BA1BC;stroke-width:1.5;" width="861.2515" x="31.562" y="599.3584"/><path d="M585.4019,599.3584 L585.4019,608.8467 L575.4019,618.8467 L31.562,618.8467" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="192.1172" x="34.562" y="613.8936">Bloc 3 &#8212; run_efootprint.py</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="347.293" x="231.1089" y="613.8936">(calcul e-footprint/Boavizta, sc&#233;nario de r&#233;f&#233;rence)</text><path d="M567.9209,673.0576 L567.9209,744.2998 L872.8135,744.2998 L872.8135,683.0576 L862.8135,673.0576 L567.9209,673.0576" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M862.8135,673.0576 L862.8135,683.0576 L872.8135,683.0576 L862.8135,673.0576" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.5859" x="573.9209" y="690.626">Cas optionnel : IA g&#233;n&#233;rative tierce d&#233;tect&#233;e</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.8926" x="573.9209" y="705.9365">-&gt; e-footprint d&#233;l&#232;gue ce calcul pr&#233;cis &#224;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.8926" x="573.9209" y="721.2471">EcoLogits (biblioth&#232;que tierce genai-impact),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.646" x="573.9209" y="736.5576">jamais ajout&#233; au total sans confirmation</text><path d="M347.2847,646.7354 L347.2847,663.0459 L327.2847,667.0459 L347.2847,671.0459 L347.2847,687.3564 A0,0 0 0 0 347.2847,687.3564 L557.9209,687.3564 A0,0 0 0 0 557.9209,687.3564 L557.9209,656.7354 L547.9209,646.7354 L347.2847,646.7354 A0,0 0 0 0 347.2847,646.7354" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M547.9209,646.7354 L547.9209,656.7354 L557.9209,656.7354 L547.9209,646.7354" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179.7974" x="353.2847" y="664.3037">Param&#232;tres : visits, instance,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.6362" x="353.2847" y="679.6143">instance-source, refresh-data</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="285.7227" x="41.562" y="635.8467"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.6445" x="51.562" y="657.4482">Mod&#232;le (mobile + desktop) -&gt;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="172.418" x="51.562" y="671.5811">impacts fabrication + &#233;nergie</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="265.7227" x="51.562" y="685.7139">par poste (devices, r&#233;seau, serveur, stockage)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="242.3926" x="63.2271" y="733.2451"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.3926" x="73.2271" y="754.8467">&#201;crire efootprint-boavizta-model.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="205.6348" x="73.2271" y="768.9795">+ efootprint-synthese-python.json</text><rect fill="#ECECF2" height="354.3584" style="stroke:#5BA1BC;stroke-width:1.5;" width="676.8174" x="22.1196" y="803.5107"/><path d="M666.0708,803.5107 L666.0708,812.999 L656.0708,822.999 L22.1196,822.999" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="313.4688" x="25.1196" y="818.0459">Bloc 3bis &#8212; Sc&#233;narios de recommandations</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="316.0527" x="343.0181" y="818.0459">(recommendations.py, dans run_efootprint.py)</text><path d="M348.0024,837.9883 L348.0024,877.2646 L328.0024,881.2646 L348.0024,885.2646 L348.0024,924.541 A0,0 0 0 0 348.0024,924.541 L688.937,924.541 A0,0 0 0 0 688.937,924.541 L688.937,847.9883 L678.937,837.9883 L348.0024,837.9883 A0,0 0 0 0 348.0024,837.9883" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M678.937,837.9883 L678.937,847.9883 L688.937,847.9883 L678.937,837.9883" fill="#FFF3CD" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.9346" x="354.0024" y="855.5566">Poids d&#233;compress&#233; DIRECT (Coverage mesure d&#233;j&#224;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="315.999" x="354.0024" y="870.8672">le code mort sur le d&#233;compress&#233;) - sauf doublons</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.2261" x="354.0024" y="886.1777">HTTP 304 (revalidation cache), exclus du poids</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="291.1289" x="354.0024" y="901.4883">d&#233;compress&#233; retirable, compt&#233;s seulement en</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.1274" x="354.0024" y="916.7988">requ&#234;tes et en octets transf&#233;r&#233;s (d&#233;j&#224; minimes)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="287.1582" x="40.8442" y="842.999"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.2715" x="50.8442" y="864.6006">dead_code_reductions, duplicate_reductions,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.4297" x="50.8442" y="878.7334">brotli_reductions -&gt; une Reduction par</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="267.1582" x="50.8442" y="892.8662">(Job, recommandation) avec octets transf&#233;r&#233;s,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.1523" x="50.8442" y="906.999">octets d&#233;compress&#233;s, requ&#234;tes retir&#233;es</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="304.6074" x="32.1196" y="944.541"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="284.6074" x="42.1196" y="966.1426">apply_recommendations -&gt; 3 SiteSpec cumul&#233;es</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="250.3301" x="42.1196" y="980.2754">(prio1, prio1+2, prio1+2+3), recalcul R&#201;EL</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.957" x="42.1196" y="994.4082">du mod&#232;le Boavizta pour chacune</text><rect fill="#E0F0F4" height="118.9297" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="273.0371" x="47.9048" y="1026.9395"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="248.0156" x="57.9048" y="1048.541">&#201;crire efootprint-scenario-{palier}.e-f.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.0469" x="57.9048" y="1062.6738">(4 fichiers : r&#233;f&#233;rence + 3 paliers,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.0371" x="57.9048" y="1076.8066">rechargeables sur e-footprint.boavizta.org)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.668" x="57.9048" y="1090.9395">+ efootprint-recommendations-gains.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.5391" x="57.9048" y="1105.0723">(gain CO2e par palier, reductions_detail</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.998" x="57.9048" y="1119.2051">par page, recommandations exclues,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="129.9902" x="57.9048" y="1133.3379">hypoth&#232;ses g&#233;n&#233;rales)</text><rect fill="#ECECF2" height="551.1445" style="stroke:#5BA1BC;stroke-width:1.5;" width="346.8467" x="11" y="1168.3223"/><path d="M347.8467,1168.3223 L347.8467,1177.8105 L337.8467,1187.8105 L11,1187.8105" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="242.8672" x="14" y="1182.8574">Bloc 4 &#8212; generate_report_html.py</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.5498" x="261.2969" y="1182.8574">(restitution)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="266.3984" x="51.2241" y="1204.8105"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="187.2715" x="61.2241" y="1226.4121">Lire les r&#233;sultats du calcul CO2e</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.1035" x="61.2241" y="1240.5449">(efootprint-synthese-python.json)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.3984" x="61.2241" y="1254.6777">et la stack technique d&#233;tect&#233;e (tech_stack)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="233.3926" x="67.7271" y="1287.209"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.3926" x="77.7271" y="1308.8105">parsing des fichiers Coverage-*.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.6875" x="77.7271" y="1322.9434">pour la section Code mort JS/CSS</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="282.1836" x="43.3315" y="1355.4746"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="261.5918" x="53.3315" y="1377.0762">Lire efootprint-recommendations-gains.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.541" x="53.3315" y="1391.209">(si absent ou sch&#233;ma ant&#233;rieur : sections</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="262.1836" x="53.3315" y="1405.3418">omises ou "non disponible", pas d'exception)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="227.7207" x="70.563" y="1437.873"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.75" x="80.563" y="1459.4746">G&#233;n&#233;rer section CO2e (KPIs,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.75" x="80.563" y="1473.6074">fabrication/&#233;nergie, hypoth&#232;ses,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.7207" x="80.563" y="1487.7402">stack technique, recommandations)</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="293.0762" x="37.8853" y="1520.2715"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="273.0762" x="47.8853" y="1541.873">Recommandations -&gt; bloc "Gain CO2e estim&#233;"</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.9121" x="47.8853" y="1556.0059">+ bloc "Gain EcoIndex &amp; LCP estim&#233;"</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.3574" x="47.8853" y="1570.1387">(recalcul par 