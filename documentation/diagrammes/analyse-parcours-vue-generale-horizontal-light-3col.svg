<?xml version="1.0" encoding="UTF-8"?>
<!--
  DRAFT (trial requested on 2026-09-18): 3-column variant of the diagram
  with 2 columns analyse-parcours-vue-generale-horizontal-light.svg, same style,
  same textual content, no block modified.
  Built by translating groups <g transform="translate(dx,dy)"> of the
  blocks of the 2-column file (never absolute coordinates recomputed by
  hand), to eliminate the risk of arithmetic error on the positions
  already validated to the pixel in the source file.
  Distribution (balancing by cumulative height of the 7 blocks, cf. calculation in
  working comment, not an estimate):
    Col 1 (x=40)   : MANUAL CAPTURE + COLLECTION + AUTOMATIC EOF JUDGMENT
                     (identical to the 2-column file, null translation)
    Col 2 (x=620)  : Legend (null translation) + CO2e IMPACT + REPORT
                     (first generation; new simple arrow between the 2,
                     same column now, which was not the case in the
                     2-column file)
    Col 3 (x=1200) : EOF QUESTIONNAIRE + REPORT (regeneration, rigid translation
                     of the pair, their internal arrow moves with them)
  2 new U-shaped connectors (JUDGMENT -> IMPACT, REPORT1 -> QUESTIONNAIRE)
  drawn on the same template as the U-shaped connector of the source file
  (same corner radii 18px, same entry margins 14/10px before the arrow).
  Do not regenerate with `plantuml -tsvg` (same reasons as the source file).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="880" viewBox="0 0 1680 880" style="background:#FFFFFF">
  <rect x="0" y="0" width="1680" height="880" fill="#FFFFFF"/>

  <text x="40" y="28" font-family="sans-serif" font-size="20" font-weight="bold" fill="#000000">Web journey analysis &#8212; Workflow overview (by theme, compact version, 3 columns)</text>

  <!-- ============ COLUMN 1 (x=40) — null translation, verbatim copy ============ -->

  <!-- start -->
  <circle cx="260" cy="70" r="9" fill="#222222"/>
  <line x1="260" y1="79" x2="260" y2="96" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="254,90 266,90 260,100" fill="#5BA1BC"/>

  <!-- MANUAL CAPTURE (special, prerequisite, single column) -->
  <rect x="40" y="100" width="440" height="249" fill="#9BD0DD" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="126" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">MANUAL CAPTURE (prerequisite, human, outside the skill)</text>
  <rect x="459" y="112" width="14" height="10" rx="1" fill="#FFFFFF" stroke="#1C2856" stroke-width="0.6"/>
  <line x1="463.5" y1="112" x2="463.5" y2="122" stroke="#1C2856" stroke-width="0.6"/>
  <line x1="465.5" y1="115.5" x2="470.5" y2="115.5" stroke="#1C2856" stroke-width="0.6"/>
  <line x1="465.5" y1="118.5" x2="470.5" y2="118.5" stroke="#1C2856" stroke-width="0.6"/>
  <line x1="40" y1="140" x2="480" y2="140" stroke="#000000" stroke-width="1.5"/>
  <rect x="55" y="153" width="410" height="82" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="176" font-family="sans-serif" font-size="14" fill="#1C2856">Network : Preserve log + Disable cache</text>
  <text x="70" y="195" font-family="sans-serif" font-size="14" fill="#1C2856">Full journey, cookies accepted</text>
  <text x="70" y="214" font-family="sans-serif" font-size="14" fill="#1C2856">-&gt; 'Save all as HAR with content' (.har)</text>
  <rect x="55" y="251" width="410" height="82" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="274" font-family="sans-serif" font-size="14" fill="#1C2856">Coverage panel (Cmd+Shift+P)</text>
  <text x="70" y="293" font-family="sans-serif" font-size="14" fill="#1C2856">Record, reload, scroll</text>
  <text x="70" y="312" font-family="sans-serif" font-size="14" fill="#1C2856">-&gt; export JSON per page (Coverage-*.json)</text>

  <line x1="260" y1="349" x2="260" y2="369" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="254,369 266,369 260,379" fill="#5BA1BC"/>

  <!-- COLLECTION -->
  <rect x="40" y="379" width="440" height="151" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="40" y="379" width="440" height="40" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="405" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">COLLECTION (automatic)</text>
  <rect x="55" y="432" width="410" height="82" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="455" font-family="sans-serif" font-size="14" fill="#1C2856">HAR, Coverage, Core Web Vitals</text>
  <text x="70" y="474" font-family="sans-serif" font-size="14" fill="#1C2856">(analyze_har.py, coverage_metrics.py,</text>
  <text x="70" y="493" font-family="sans-serif" font-size="14" fill="#1C2856">collect_cwv_pagespeed.py or run_lighthouse.sh as fallback)</text>

  <line x1="260" y1="530" x2="260" y2="550" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="254,550 266,550 260,560" fill="#5BA1BC"/>

  <!-- AUTOMATIC EOF JUDGMENT -->
  <rect x="40" y="560" width="440" height="170" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <rect x="40" y="560" width="440" height="40" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
  <text x="55" y="586" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">AUTOMATIC EOF JUDGMENT (automatic)</text>
  <rect x="55" y="613" width="410" height="101" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
  <text x="70" y="636" font-family="sans-serif" font-size="14" fill="#1C2856">run_eof.py compares the data</text>
  <text x="70" y="655" font-family="sans-serif" font-size="14" fill="#1C2856">already collected against the EOF reference</text>
  <text x="70" y="674" font-family="sans-serif" font-size="14" fill="#1C2856">(~10 criteria out of 54 settled by script,</text>
  <text x="70" y="693" font-family="sans-serif" font-size="14" fill="#1C2856">the stays stays 'I don't know')</text>

  <!-- ============ CONNECTOR 1: JUDGMENT (col 1) -> CO2e IMPACT (col 2) ============ -->
  <path d="M 260,730 L 260,742 Q 260,760 278,760 L 532,760 Q 550,760 550,742 L 550,363 Q 550,345 568,345 L 606,345"
        fill="none" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="610,339 610,351 620,345" fill="#5BA1BC"/>

  <!-- ============ COLUMN 2 (x=620) ============ -->

  <!-- Legend — null translation, verbatim copy -->
  <rect x="620" y="100" width="440" height="195" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
  <text x="635" y="126" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">Legend</text>
  <rect x="635" y="141" width="26" height="18" fill="#ECECF2" stroke="#5BA1BC" stroke-width="1"/>
  <text x="672" y="155" font-family="sans-serif" font-size="14" fill="#1C2856">Pale grey background: automatic</text>
  <text x="672" y="173" font-family="sans-serif" font-size="13" fill="#1C2856">(machine calculation, no human action)</text>
  <rect x="635" y="192" width="26" height="18" fill="#9BD0DD" stroke="#5BA1BC" stroke-width="1"/>
  <text x="672" y="206" font-family="sans-serif" font-size="14" fill="#1C2856">Light blue background: human action required</text>
  <text x="672" y="223" font-family="sans-serif" font-size="13" fill="#1C2856">(input, decision, or answer from an external third party)</text>
  <rect x="635" y="243" width="26" height="18" rx="1" fill="#FFFFFF" stroke="#1C2856" stroke-width="0.75"/>
  <line x1="643" y1="243" x2="643" y2="261" stroke="#1C2856" stroke-width="0.75"/>
  <line x1="648" y1="249" x2="657" y2="249" stroke="#1C2856" stroke-width="0.75"/>
  <line x1="648" y1="255" x2="657" y2="255" stroke="#1C2856" stroke-width="0.75"/>
  <text x="672" y="257" font-family="sans-serif" font-size="14" fill="#1C2856">Reference doc: capture-har-and-coverage.md</text>
  <text x="672" y="274" font-family="sans-serif" font-size="13" fill="#1C2856">../../.claude/skills/analyse-parcours/docs/</text>

  <!-- CO2e IMPACT — translate(+580,-435) from the source file (40,760)->(620,325) -->
  <g transform="translate(580,-435)">
    <rect x="40" y="760" width="440" height="249" fill="#9BD0DD" stroke="#000000" stroke-width="1.5"/>
    <text x="55" y="786" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">CO2e IMPACT (optional, at any time)</text>
    <line x1="40" y1="800" x2="480" y2="800" stroke="#000000" stroke-width="1.5"/>
    <rect x="55" y="813" width="410" height="101" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
    <text x="70" y="836" font-family="sans-serif" font-size="14" fill="#1C2856">/efootprint -&gt; Boavizta model (reference</text>
    <text x="70" y="855" font-family="sans-serif" font-size="14" fill="#1C2856">+ 3 scenarios cumulative prio1 / prio1+2 / prio1+2+3)</text>
    <text x="70" y="874" font-family="sans-serif" font-size="14" fill="#1C2856">-&gt; data available for the NEXT</text>
    <text x="70" y="893" font-family="sans-serif" font-size="14" fill="#1C2856">generation of report, not an add-on final isolated</text>
    <rect x="55" y="930" width="410" height="63" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
    <text x="70" y="953" font-family="sans-serif" font-size="14" fill="#1C2856">Possible human action: annual traffic and</text>
    <text x="70" y="972" font-family="sans-serif" font-size="14" fill="#1C2856">size of instance cloud, if not auto-detected</text>
  </g>

  <!-- new simple arrow IMPACT -> REPORT1 (same column now) -->
  <line x1="840" y1="574" x2="840" y2="594" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="834,594 846,594 840,604" fill="#5BA1BC"/>

  <!-- REPORT - first generation — translate(0,+279) from (620,325)->(620,604) -->
  <g transform="translate(0,279)">
    <rect x="620" y="325" width="440" height="189" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="620" y="325" width="440" height="40" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
    <text x="635" y="351" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">REPORT &#8212; first generation (automatic)</text>
    <rect x="635" y="378" width="410" height="120" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
    <text x="650" y="401" font-family="sans-serif" font-size="14" fill="#1C2856">generate_report_html.py</text>
    <text x="650" y="420" font-family="sans-serif" font-size="14" fill="#1C2856">(+ check_report_values.py, check</text>
    <text x="650" y="439" font-family="sans-serif" font-size="14" fill="#1C2856">internal not blocking)</text>
    <text x="650" y="458" font-family="sans-serif" font-size="14" fill="#1C2856">-&gt; contains already the judgment EOF automatic</text>
    <text x="650" y="477" font-family="sans-serif" font-size="14" fill="#1C2856">(partial) and the CO2e if already calculated</text>
  </g>

  <!-- ============ CONNECTOR 2: REPORT1 (col 2) -> EOF QUESTIONNAIRE (col 3) ============ -->
  <path d="M 840,793 L 840,805 Q 840,823 858,823 L 1112,823 Q 1130,823 1130,805 L 1130,268 Q 1130,250 1148,250 L 1186,250"
        fill="none" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1190,244 1190,256 1200,250" fill="#5BA1BC"/>

  <!-- ============ COLUMN 3 (x=1200) ============ -->

  <!-- EOF QUESTIONNAIRE — translate(+580,-444) from (620,544)->(1200,100) -->
  <g transform="translate(580,-444)">
    <rect x="620" y="544" width="440" height="325" fill="#9BD0DD" stroke="#000000" stroke-width="1.5"/>
    <text x="635" y="570" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">EOF QUESTIONNAIRE (manual, decision of mission)</text>
    <line x1="620" y1="584" x2="1060" y2="584" stroke="#000000" stroke-width="1.5"/>
    <rect x="635" y="597" width="410" height="101" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
    <text x="650" y="620" font-family="sans-serif" font-size="14" fill="#1C2856">When: after the automatic judgment,</text>
    <text x="650" y="639" font-family="sans-serif" font-size="14" fill="#1C2856">only on the remaining criteria</text>
    <text x="650" y="658" font-family="sans-serif" font-size="14" fill="#1C2856">'I don't know' - never before,</text>
    <text x="650" y="677" font-family="sans-serif" font-size="14" fill="#1C2856">never triggered on its own</text>
    <rect x="635" y="714" width="410" height="139" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
    <text x="650" y="737" font-family="sans-serif" font-size="14" fill="#1C2856">generate_questionnaire.py -&gt; file to fill in</text>
    <text x="650" y="756" font-family="sans-serif" font-size="14" fill="#1C2856">(questionnaire-eof.md), sent to client,</text>
    <text x="650" y="775" font-family="sans-serif" font-size="14" fill="#1C2856">filled in, read (parse_questionnaire.py),</text>
    <text x="650" y="794" font-family="sans-serif" font-size="14" fill="#1C2856">merged (merge_lots.py) according to the</text>
    <text x="650" y="813" font-family="sans-serif" font-size="14" fill="#1C2856">precedence collected &gt; estimated &gt; stated</text>
    <text x="650" y="832" font-family="sans-serif" font-size="14" fill="#1C2856">&gt; declared &gt; assumed</text>
  </g>

  <!-- internal arrow QUESTIONNAIRE -> REPORT2, translated with the pair (+580,-444): (840,869-889-899)->(1420,425-445-455) -->
  <line x1="1420" y1="425" x2="1420" y2="445" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1414,445 1426,445 1420,455" fill="#5BA1BC"/>

  <!-- REPORT - regeneration — translate(+580,-444) from (620,899)->(1200,455) -->
  <g transform="translate(580,-444)">
    <rect x="620" y="899" width="440" height="151" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <rect x="620" y="899" width="440" height="40" fill="#ECECF2" stroke="#000000" stroke-width="1.5"/>
    <text x="635" y="925" font-family="sans-serif" font-size="16" font-weight="bold" fill="#000000">REPORT &#8212; regeneration (automatic)</text>
    <rect x="635" y="952" width="410" height="82" rx="12" ry="12" fill="#E0F0F4" stroke="#5BA1BC" stroke-width="0.75"/>
