    <text x="650" y="994" font-family="sans-serif" font-size="14" fill="#1C2856">-&gt; reflects the answers of questionnaire</text>
    <text x="650" y="1013" font-family="sans-serif" font-size="14" fill="#1C2856">merged (+ CO2e if calculated meanwhile)</text>
  </g>

  <!-- stop, translate(+580,-444) from (840,1050..1090)->(1420,606..646) -->
  <line x1="1420" y1="606" x2="1420" y2="631" stroke="#5BA1BC" stroke-width="1.5"/>
  <polygon points="1414,625 1426,625 1420,635" fill="#5BA1BC"/>
  <circle cx="1420" cy="646" r="11" fill="none" stroke="#222222" stroke-width="1.5"/>
  <circle cx="1420" cy="646" r="6" fill="#222222"/>
</svg>
