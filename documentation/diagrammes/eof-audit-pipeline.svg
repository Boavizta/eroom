<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1500px" preserveAspectRatio="none" style="width:778px;height:1500px;background:#FFFFFF;" version="1.1" viewBox="0 0 778 1500" width="778px" zoomAndPan="magnify"><title>&#201;tape "eof-audit" (skill analyse-parcours) &#8212; Pipeline outils -&gt; r&#233;f&#233;rentiel EOF</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="566.084" x="104.5923" y="33.5352">&#201;tape "eof-audit" (skill analyse-parcours) &#8212; Pipeline outils -&gt; r&#233;f&#233;rentiel EOF</text></g><ellipse cx="274.0391" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#ECECF2" height="345.1484" style="stroke:#5BA1BC;stroke-width:1.5;" width="639.1416" x="128.127" y="77.4883"/><path d="M531.0088,77.4883 L531.0088,86.9766 L521.0088,96.9766 L128.127,96.9766" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="166.8174" x="131.127" y="92.0234">Sources d&#233;j&#224; collect&#233;es</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="221.6348" x="302.374" y="92.0234">(parcours de base + e-footprint)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="271.8242" x="138.127" y="113.9766"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.9648" x="148.127" y="135.5781">env-data.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="251.8242" x="148.127" y="149.7109">(device_mix, servers[], traffic, tech_stack...)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="244.6953" x="151.6914" y="182.2422"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.3301" x="161.6914" y="203.8438">audit/har-analysis.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.6953" x="161.6914" y="217.9766">(domaines, http_codes, duplicate_urls)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="189.4648" x="179.3066" y="250.5078"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.4648" x="189.3066" y="272.1094">audit/coverage-analysis.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="150.4102" x="189.3066" y="286.2422">(JS/CSS inutilis&#233; par page)</text><path d="M422.3896,308.7734 L422.3896,355.7051 L402.3896,359.7051 L422.3896,363.7051 L422.3896,410.6367 A0,0 0 0 0 422.3896,410.6367 L757.2686,410.6367 A0,0 0 0 0 757.2686,410.6367 L757.2686,318.7734 L747.2686,308.7734 L422.3896,308.7734 A0,0 0 0 0 422.3896,308.7734" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M747.2686,308.7734 L747.2686,318.7734 L757.2686,318.7734 L747.2686,308.7734" fill="#C8E6C9" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.2803" x="428.3896" y="326.3418">cwv.json &#233;tendu Phase 1 (2026-09-03) :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.1196" x="428.3896" y="341.6523">collect_cwv_pagespeed.py demande en plus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.626" x="428.3896" y="356.9629">les cat&#233;gories "accessibility" et</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="286.1968" x="428.3896" y="372.2734">"best-practices" (m&#234;me appel API PageSpeed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.874" x="428.3896" y="387.584">aucun co&#251;t r&#233;seau additionnel) -&gt;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="313.8789" x="428.3896" y="402.8945">accessibility_score_pct / best_practices_score_pct</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="256.7012" x="145.6885" y="335.5723"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="49.9863" x="155.6885" y="357.1738">cwv.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.7012" x="155.6885" y="371.3066">(LCP/INP/CLS &#8212; CrUX ou PageSpeed lab)</text><rect fill="#ECECF2" height="361.6797" style="stroke:#5BA1BC;stroke-width:1.5;" width="617.9463" x="117.876" y="432.6367"/><path d="M445.665,432.6367 L445.665,442.125 L435.665,452.125 L117.876,452.125" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="142.3447" x="120.876" y="447.1719">Extracteurs Phase 1</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.0146" x="267.6504" y="447.1719">(nouveaux, 2026-09-03)</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="274.4316" x="136.8232" y="469.125"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="128.8242" x="146.8232" y="490.7266">parse_html_criteria.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="214.9453" x="146.8232" y="504.8594">re-fetch live des pages d&#233;j&#224; audit&#233;es</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.7207" x="146.8232" y="518.9922">(le .har captur&#233; ne contient pas les</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.4316" x="146.8232" y="533.125">corps HTML/CSS &#8212; v&#233;rifi&#233; : 46/311 entr&#233;es</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="244.8398" x="146.8232" y="547.2578">avec un body, aucune de page HTML/CSS)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="148.2422" x="146.8232" y="561.3906">-&gt; html-css-criteria.json</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.3262" x="127.876" y="593.9219"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="165.1816" x="137.876" y="615.5234">analyze_security_headers.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.3262" x="137.876" y="629.6563">score s&#233;curit&#233; local (type securityheaders.com)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="212.6133" x="137.876" y="643.7891">depuis les en-t&#234;tes d&#233;j&#224; dans le .har</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.25" x="137.876" y="657.9219">-&gt; security-headers-analysis.json</text><path d="M424.5605,680.4531 L424.5605,727.3848 L404.5605,731.3848 L424.5605,735.3848 L424.5605,782.3164 A0,0 0 0 0 424.5605,782.3164 L725.8223,782.3164 A0,0 0 0 0 725.8223,782.3164 L725.8223,690.4531 L715.8223,680.4531 L424.5605,680.4531 A0,0 0 0 0 424.5605,680.4531" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M715.8223,680.4531 L715.8223,690.4531 L725.8223,690.4531 L715.8223,680.4531" fill="#E0F0F4" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="257.9878" x="430.5605" y="698.0215">Pi&#232;ge rencontr&#233; et corrig&#233; sur octo.com :</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.8408" x="430.5605" y="713.332">robots.txt ET sitemap.xml renvoyaient un</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5107" x="430.5605" y="728.6426">statut 200 mais le HTML de fallback de la</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1162" x="430.5605" y="743.9531">SPA (catch-all routing), pas la ressource</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.2617" x="430.5605" y="759.2637">demand&#233;e -&gt; d&#233;tection ajout&#233;e pour ne pas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.2314" x="430.5605" y="774.5742">compter un faux "pr&#233;sent".</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="261.043" x="143.5176" y="693.1191"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="111.3516" x="153.5176" y="714.7207">scan_wellknown.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.6113" x="153.5176" y="728.8535">fetch direct security.txt / robots.txt /</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="241.043" x="153.5176" y="742.9863">sitemap.xml (3 requ&#234;tes HTTP publiques)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.3379" x="153.5176" y="757.1191">-&gt; wellknown-scan.json</text><rect fill="#ECECF2" height="438.1465" style="stroke:#5BA1BC;stroke-width:1.5;" width="736.0142" x="11" y="804.3164"/><path d="M320.0654,804.3164 L320.0654,813.8047 L310.0654,823.8047 L11,823.8047" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="75.5986" x="14" y="818.8516">run_eof.py</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.0371" x="94.0283" y="818.8516">(d&#233;terministe, aucun calcul LLM)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="273.4414" x="137.3184" y="840.8047"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.8047" x="147.3184" y="862.4063">Charger eof-referentiel.json</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.3887" x="147.3184" y="876.5391">(54 crit&#232;res + 16 Diagnostic rapide,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="253.4414" x="147.3184" y="890.6719">produit par le skill eof, JAMAIS r&#233;g&#233;n&#233;r&#233; ici)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="206.8027" x="170.6377" y="923.2031"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="186.8027" x="180.6377" y="944.8047">Charger les 7 sources ci-dessus</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="152.6309" x="180.6377" y="958.9375">dans un dict data{} unique</text><polygon fill="#E0F0F4" points="194.1091,991.4688,353.969,991.4688,365.969,1004.4238,353.969,1017.3789,194.1091,1017.3789,182.1091,1004.4238,194.1091,991.4688" style="stroke:#5BA1BC;stroke-width:0.5;"/><text fill="#1C2856" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="159.8599" x="194.1091" y="1002.1035">R&#232;gle "automatisable" tranche</text><text fill="#1C2856" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="89.2729" x="201.0701" y="1015.0586">sans ambigu&#239;t&#233; ?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.7632" x="165.3459" y="1002.1035">oui</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="128.3154" x="365.969" y="1002.1035">non / cat&#233;gorie "partiel"</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="237.2578" x="23" y="1027.3789"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.9219" x="33" y="1048.9805">Cocher une option du menu &#224; 5</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="217.2578" x="33" y="1063.1133">(dont "&#129300; &#192; &#233;valuer" si zone ambigu&#235;</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="201.6387" x="33" y="1077.2461">&#8212; reste une r&#233;ponse explicite, pas</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.0449" x="33" y="1091.3789">un "je ne sais pas")</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="252.3828" x="280.2578" y="1027.3789"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="232.3828" x="290.2578" y="1048.9805">Afficher un indice contextuel en annexe</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.7852" x="290.2578" y="1063.1133">(confidence low/medium, jamais coch&#233;)</text><polygon fill="#E0F0F4