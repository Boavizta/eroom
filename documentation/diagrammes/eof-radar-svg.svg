<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:667px;height:609px;background:#FFFFFF;" width="667px" height="609px" viewBox="0 0 667 609" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="81"><text x="117.906" y="33.535" fill="#000" font-size="14" textLength="430.063" font-weight="700">EOF skill — generate_radar_svg.py (independent of Block 2)</text></g><ellipse cx="161.452" cy="62.488" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="20.826" y="92.488" width="281.252" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="30.826" y="114.09" fill="#1C2856" font-size="12" textLength="196.236">Input: list (category, value 0-100)</text><text x="30.826" y="128.223" fill="#1C2856" font-size="12" textLength="183.896">— fictitious for a test, real once</text><text x="30.826" y="142.355" fill="#1C2856" font-size="12" textLength="261.252">an audit is filled in (ex. octo.com, upcoming)</text><rect x="16" y="164.887" width="631.874" height="328.66" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M276.346,164.887 L276.346,174.375 L266.346,184.375 L16,184.375" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="19" y="179.422" fill="#000" font-size="14" textLength="250.346" font-weight="700">generate_radar_svg.py::radar_svg()</text><rect x="26" y="201.375" width="270.904" height="48.266" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="222.977" fill="#1C2856" font-size="12" textLength="250.904">Compute the coordinates by trigonameetry</text><text x="36" y="237.109" fill="#1C2856" font-size="12" textLength="173.379">(cos/sin, 1 axis every 360°/n)</text><rect x="49.396" y="269.641" width="224.111" height="48.26