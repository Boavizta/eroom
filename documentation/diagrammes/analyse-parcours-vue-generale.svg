<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="850px" preserveAspectRatio="none" style="width:665px;height:850px;background:#FFFFFF;" version="1.1" viewBox="0 0 665 850" width="665px" zoomAndPan="magnify"><title>Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="518.9707" x="71.866" y="33.5352">Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</text></g><ellipse cx="196.3281" cy="57.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="370.6563" x="11" y="77.4883"/><path d="M194.4072,77.4883 L194.4072,86.9766 L184.4072,96.9766 L11,96.9766" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="74.2314" x="14" y="92.0234">COLLECTE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="92.6611" y="92.0234">(automatique)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="350.6563" x="21" y="113.9766"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.5313" x="31" y="135.5781">HAR, Coverage, Core Web Vitals</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="31" y="149.7109">(analyze_har.py, coverage_metrics.py,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.6563" x="31" y="163.8438">collect_cwv_pagespeed.py ou run_lighthouse.sh en repli)</text><rect fill="#ECECF2" height="125.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="342.2939" x="25.1812" y="198.8281"/><path d="M357.4751,198.8281 L357.4751,208.3164 L347.4751,218.3164 L25.1812,218.3164" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="223.1182" x="28.1812" y="213.3633">JUGEMENT AUTOMATIQUE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="255.729" y="213.3633">(automatique)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="251.9492" x="70.3535" y="235.3164"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1406" x="80.3535" y="256.918">run_eof.py confronte les donnees</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1484" x="80.3535" y="271.0508">deja collectees au referentiel EOF</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.9492" x="80.3535" y="285.1836">(~10 criteres sur 54 tranches par script,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6719" x="80.3535" y="299.3164">le reste reste "je ne sais pas")</text><rect fill="#DBDDE5" height="235.6836" style="stroke:#5BA1BC;stroke-width:1.5;" width="596.1333" x="58.5693" y="333.8477"/><path d="M426.6836,333.8477 L426.6836,343.3359 L416.6836,353.3359 L58.5693,353.3359" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="151.1973" x="61.5693" y="348.3828">QUESTIONNAIRE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.4873" x="217.1963" y="348.3828">(manuel, decision de mission)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="255.5176" x="68.5693" y="370.3359"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.5176" x="78.5693" y="391.9375">Quand : apres le jugement automatique,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.2227" x="78.5693" y="406.0703">uniquement sur les criteres restes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.6758" x="78.5693" y="420.2031">"je ne sais pas" - jamais avant,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.2715" x="78.5693" y="434.3359">jamais declenche seul</text><path d="M340.9463,468.9229 L340.9463,508.1992 L320.9463,512.1992 L340.9463,516.1992 L340.9463,555.4756 A0,0 0 0 0 340.9463,555.4756 L644.7026,555.4756 A0,0 0 0 0 644.7026,555.4756 L644.7026,478.9229 L634.7026,468.9229 L340.9463,468.9229 A0,0 0 0 0 340.9463,468.9229" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M634.7026,468.9229 L634.7026,478.9229 L644.7026,478.9229 L634.7026,468.9229" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.7563" x="346.9463" y="486.4912">Piege a eviter : ne jamais relancer run_eof.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.6885" x="346.9463" y="501.8018">seul apres une relecture de questionnaire</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.2183" x="346.9463" y="517.1123">(ecrase les reponses en silence). Toujours</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.3154" x="346.9463" y="532.4229">parse_questionnaire.py -&gt; fusionner_lots.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.1685" x="346.9463" y="547.7334">-&gt; generate_report_html.py.</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="249.2363" x="71.71" y="466.8672"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="213.4219" x="81.71" y="488.4688">Comment : genere, envoye au client,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.0215" x="81.71" y="502.6016">rempli, relu (parse_questionnaire.py),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.1484" x="81.71" y="516.7344">fusionne (fusionner_lots.py) selon la</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.2363" x="81.71" y="530.8672">precedence collecte &gt; estime &gt; precise</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.3887" x="81.71" y="545">&gt; declare &gt; suppose</text><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="260.6582" x="65.999" y="579.5313"/><path d="M243.1582,579.5313 L243.1582,589.0195 L233.1582,599.0195 L65.999,599.0195" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="67.9834" x="68.999" y="594.0664">RAPPORT</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="141.4121" y="594.0664">(automatique)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="240.6582" x="75.999" y="616.0195"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="85.999" y="637.6211">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="85.999" y="651.7539">(+ check_valeurs_rapport.py, controle</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.8496" x="85.999" y="665.8867">interne non bloquant)</text><rect fill="#9BD0DD" height="96.7539" style="stroke:#5BA1BC;stroke-width:1.5;" width="297.4229" x="47.6167" y="700.8711"/><path d="M335.0396,700.8711 L335.0396,710.3594 L325.0396,720.3594 L47.6167,720.3594" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="99.4287" x="50.6167" y="715.4063">IMPACT CO2e</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="173.5645" x="154.4751" y="715.4063">(optionnel, a la demande)</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="229.5313" x="81.5625" y="737.3594"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.9023" x="91.5625" y="758.9609">/efootprint -&gt; modele Boavizta</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="209.5313" x="91.5625" y="773.0938">-&gt; section CO2e ajoutee au rapport</text><ellipse cx="196.3281" cy="828.625" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="196.3281" cy="828.625" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="196.3281" x2="196.3281" y1="67.4883" y2="113.9766"/><polygon fill="#5BA1BC" points="192.3281,103.9766,196.3281,113.9766,200.3281,103.9766,196.3281,107.9766" style="stroke:#5BA1BC;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-