<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1527px" preserveAspectRatio="none" style="width:785px;height:1527px;background:#FFFFFF;" version="1.1" viewBox="0 0 785 1527" width="785px" zoomAndPan="magnify"><title>Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</title><defs><filter height="1" id="b5wz7bsy5y4zm0" width="1" x="0" y="0"><feFlood flood-color="#ECECF2" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b5wz7bsy5y4zm1" width="1" x="0" y="0"><feFlood flood-color="#9BD0DD" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="518.9707" x="131.8435" y="33.5352">Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</text></g><g class="legend" data-source-line="23"><rect fill="none" height="174.8828" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="374.3896" x="386.2681" y="59.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="60.457" x="391.2681" y="78.0234">L&#233;gende</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="391.2681" y="94.5117">&#160;</text><text fill="#ECECF2" filter="url(#b5wz7bsy5y4zm0)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.582" x="391.2681" y="111">XXXXXX</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="195.4258" x="452.7095" y="111">Fond gris p&#226;le : automatique</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="276.2607" x="391.2681" y="127.4883">(calcul machine, aucune action humaine)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="391.2681" y="143.9766">&#160;</text><text fill="#9BD0DD" filter="url(#b5wz7bsy5y4zm1)" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.582" x="391.2681" y="160.4648">XXXXXX</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="272.8838" x="452.7095" y="160.4648">Fond bleu clair : action humaine requise</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="321.5762" x="391.2681" y="176.9531">(saisie, d&#233;cision, ou r&#233;ponse d'un tiers externe)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4297" x="391.2681" y="193.4414">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="364.3896" x="391.2681" y="209.9297">[r&#233;f] Doc de r&#233;f&#233;rence : capturer-har-et-coverage.md</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="294.9092" x="391.2681" y="226.418">../../.claude/skills/analyse-parcours/docs/</text></g><ellipse cx="196.3281" cy="257.3711" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#9BD0DD" height="193.2852" style="stroke:#5BA1BC;stroke-width:1.5;" width="724.7515" x="49.9063" y="277.3711"/><path d="M447.5381,277.3711 L447.5381,286.8594 L437.5381,296.8594 L49.9063,296.8594" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="148.7021" x="52.9063" y="291.9063">CAPTURE MANUELLE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="234.5" x="206.0381" y="291.9063">[r&#233;f] (prealable, humain, hors skill)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="248.3164" x="72.1699" y="313.8594"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="227.8184" x="82.1699" y="335.4609">Network : Preserve log + Disable cache</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.8887" x="82.1699" y="349.5938">Parcours complet, cookies acceptes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="228.3164" x="82.1699" y="363.7266">-&gt; "Save all as HAR with content" (.har)</text><path d="M352.75,399.4912 L352.75,423.457 L332.75,427.457 L352.75,431.457 L352.75,455.4229 A0,0 0 0 0 352.75,455.4229 L764.6577,455.4229 A0,0 0 0 0 764.6577,455.4229 L764.6577,409.4912 L754.6577,399.4912 L352.75,399.4912 A0,0 0 0 0 352.75,399.4912" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M754.6577,399.4912 L754.6577,409.4912 L764.6577,409.4912 L754.6577,399.4912" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.7798" x="358.75" y="417.0596">cwv.json (Core Web Vitals) optionnel : Lighthouse se</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="390.9077" x="358.75" y="432.3701">lance automatiquement si absent (collect_cwv_pagespeed.py),</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="276.7769" x="358.75" y="447.6807">ou fourni par l'utilisateur (RUM/PageSpeed).</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="272.8438" x="59.9063" y="396.2578"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.5039" x="69.9063" y="417.8594">Coverage panel (Cmd+Shift+P)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="177.6797" x="69.9063" y="431.9922">Enregistrer, recharger, scroller</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="252.8438" x="69.9063" y="446.125">-&gt; export JSON par page (Coverage-*.json)</text><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="370.6563" x="11" y="480.6563"/><path d="M194.4072,480.6563 L194.4072,490.1445 L184.4072,500.1445 L11,500.1445" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="74.2314" x="14" y="495.1914">COLLECTE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="92.6611" y="495.1914">(automatique)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="350.6563" x="21" y="517.1445"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.5313" x="31" y="538.7461">HAR, Coverage, Core Web Vitals</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="31" y="552.8789">(analyze_har.py, coverage_metrics.py,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.6563" x="31" y="567.0117">collect_cwv_pagespeed.py ou run_lighthouse.sh en repli)</text><rect fill="#ECECF2" height="125.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="342.2939" x="25.1812" y="601.9961"/><path d="M357.4751,601.9961 L357.4751,611.4844 L347.4751,621.4844 L25.1812,621.4844" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="223.1182" x="28.1812" y="616.5313">JUGEMENT AUTOMATIQUE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="255.729" y="616.5313">(automatique)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="251.9492" x="70.3535" y="638.4844"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1406" x="80.3535" y="660.0859">run_eof.py confronte les donnees</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1484" x="80.3535" y="674.2188">deja collectees au referentiel EOF</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.9492" x="80.3535" y="688.3516">(~10 criteres sur 54 tranches par script,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6719" x="80.3535" y="702.4844">le reste reste "je ne sais pas")</text><rect fill="#9BD0DD" height="206.2617" style="stroke:#5BA1BC;stroke-width:1.5;" width="672.6899" x="20.6035" y="737.0156"/><path d="M317.7607,737.0156 L317.7607,746.5039 L307.7607,756.5039 L20.6035,756.5039" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="99.4287" x="23.6035" y="751.5508">IMPACT CO2e</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.2988" x="127.4619" y="751.5508">(optionnel, a tout moment)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="331.4492" x="30.6035" y="773.5039"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.1699" x="40.6035" y="795.1055">/efootprint -&gt; modele Boavizta (reference</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.4492" x="40.6035" y="809.2383">+ 3 scenarios cumules prio1 / prio1+2 / prio1+2+3)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.7227" x="40.6035" y="823.3711">-&gt; donnees disponibles pour la PROCHAINE</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.7109" x="40.6035" y="837.5039">generation du rapport, pas un ajout final isole</text><path d="M353.9688,860.0352 L353.9688,891.6563 L333.9688,895.6563 L353.9688,899.6563 L353.9688,931.2773 A0,0 0 0 0 353.9688,931.2773 L683.2935,931.2773 A0,0 0 0 0 683.2935,931.2773 L683.2935,870.0352 L673.2935,860.0352 L353.9688,860.0352 A0,0 0 0 0 353.9688,860.0352" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M673.2935,860.0352 L673.2935,870.0352 L683.2935,870.0352 L673.2935,860.0352" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.3247" x="359.9688" y="877.6035">Peut se lancer avant ou apres le premier rapport,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.4004" x="359.9688" y="892.9141">avant ou apres le questionnaire EOF : chaque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.8745" x="359.9688" y="908.2246">generation du rapport reprend simplement les</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2939" x="359.9688" y="923.5352">donnees alors disponibles sur disque.</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="275.2813" x="58.6875" y="871.5234"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.7891" x="68.6875" y="893.125">Action humaine possible : trafic annuel et</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.2813" x="68.6875" y="907.2578">taille d'instance cloud, si non auto-detectes</text><rect fill="#ECECF2" height="139.1523" style="stroke:#5BA1BC;stroke-width:1.5;" width="357.5381" x="17.5591" y="953.7305"/><path d="M365.0972,953.7305 L365.0972,963.2188 L355.0972,973.2188 L17.5591,973.2188" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="238.3623" x="20.5591" y="968.2656">RAPPORT &#8212; premiere generation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="263.3511" y="968.2656">(automatique)</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.2324" x="50.2119" y="990.2188"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="60.2119" y="1011.8203">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="60.2119" y="1025.9531">(+ check_valeurs_rapport.py, controle</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.8496" x="60.2119" y="1040.0859">interne non bloquant)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.2324" x="60.2119" y="1054.2188">-&gt; contient deja le jugement EOF automatique</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1055" x="60.2119" y="1068.3516">(partiel) et le CO2e si deja calcule</text><rect fill="#9BD0DD" height="249.8164" style="stroke:#5BA1BC;stroke-width:1.5;" width="635.1392" x="40.6367" y="1102.8828"/><path d="M408.751,1102.8828 L408.751,1112.3711 L398.751,1122.3711 L40.6367,1122.3711" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="151.1973" x="43.6367" y="1117.418">QUESTIONNAIRE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.4873" x="199.2637" y="1117.418">(manuel, decision de mission)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="255.5176" x="68.5693" y="1139.3711"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.5176" x="78.5693" y="1160.9727">Quand : apres le jugement automatique,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.2227" x="78.5693" y="1175.1055">uniquement sur les criteres restes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.6758" x="78.5693" y="1189.2383">"je ne sais pas" - jamais avant,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.2715" x="78.5693" y="1203.3711">jamais declenche seul</text><path d="M362.0195,1245.0244 L362.0195,1284.3008 L342.0195,1288.3008 L362.0195,1292.3008 L362.0195,1331.5771 A0,0 0 0 0 362.0195,1331.5771 L665.7759,1331.5771 A0,0 0 0 0 665.7759,1331.5771 L665.7759,1255.0244 L655.7759,1245.0244 L362.0195,1245.0244 A0,0 0 0 0 362.0195,1245.0244" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M655.7759,1245.0244 L655.7759,1255.0244 L665.7759,1255.0244 L655.7759,1245.0244" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.7563" x="368.0195" y="1262.5928">Piege a eviter : ne jamais relancer run_eof.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.6885" x="368.0195" y="1277.9033">seul apres une relecture de questionnaire</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.2183" x="368.0195" y="1293.2139">(ecrase les reponses en silence). Toujours</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.3154" x="368.0195" y="1308.5244">parse_questionnaire.py -&gt; fusionner_lots.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.1685" x="368.0195" y="1323.835">-&gt; generate_report_html.py.</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="291.3828" x="50.6367" y="1235.9023"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.3828" x="60.6367" y="1257.5039">generate_questionnaire.py -&gt; fichier a remplir</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9199" x="60.6367" y="1271.6367">(questionnaire-eof.md), envoye au client,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.0215" x="60.6367" y="1285.7695">rempli, relu (parse_questionnaire.py),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.1484" x="60.6367" y="1299.9023">fusionne (fusionner_lots.py) selon la</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.2363" x="60.6367" y="1314.0352">precedence collecte &gt; estime &gt; precise</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.3887" x="60.6367" y="1328.168">&gt; declare &gt; suppose</text><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="302.748" x="44.9541" y="1363.1523"/><path d="M337.7021,1363.1523 L337.7021,1372.6406 L327.7021,1382.6406 L44.9541,1382.6406" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="183.5723" x="47.9541" y="1377.6875">RAPPORT &#8212; regeneration</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="235.9561" y="1377.6875">(automatique)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="274.209" x="59.2236" y="1399.6406"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="69.2236" y="1421.2422">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="236.6777" x="69.2236" y="1435.375">-&gt; reflete les reponses du questionnaire</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="254.209" x="69.2236" y="1449.5078">fusionnees (+ CO2e si calcule entre-temps)</text><ellipse cx="196.3281" cy="1505.0391" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="196.3281" cy="1505.0391" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="196.3281" x2="196.3281" y1="376.2578" y2="396.2578"/><polygon fill="#5BA1BC" points="192.3281,386.2578,196.3281,396.2578,200.3281,386.2578,196.3281,390.2578" style="stroke:#5BA1BC;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="196.3281" x2="196.3281" y1="267.3711" y2="313.8594"/><polygon fill="#5BA1BC" points="192.3281,303.8594,196.3281,313.8594,200.3281,303.8594,196.3281,307.8594" style="stroke:#5BA1BC;stroke-width:1;"/><line style="stroke:#5BA1BC;stroke-width:1;" x1="196.3281" x2="196.3281" y1="458.6563" y2="517.1445"/><polygon fill="#5BA1BC" points="192.3281,507.1445,196.3281,517.1445,200.3281,507.1445,196.3281,511.1445" style="str