<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1240px" preserveAspectRatio="none" style="width:704px;height:1240px;background:#FFFFFF;" version="1.1" viewBox="0 0 704 1240" width="704px" zoomAndPan="magnify"><title>Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="518.9707" x="91.1614" y="33.5352">Analyse de parcours web &#8212; Vue generale du workflow (par thematique)</text></g><path d="M237.3674,57.4883 L237.3674,113.4199 L514.8953,113.4199 L514.8953,67.4883 L504.8953,57.4883 L237.3674,57.4883" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M504.8953,57.4883 L504.8953,67.4883 L514.8953,67.4883 L504.8953,57.4883" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="56.1387" x="243.3674" y="75.0566">Legende</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.4668" x="243.3674" y="90.3672">Fond gris pale : automatique</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.5278" x="243.3674" y="105.6777">(calcul machine, aucune action humaine)</text><path d="M216.3281,133.4199 L216.3281,174.041 L535.9346,174.041 L535.9346,143.4199 L525.9346,133.4199 L216.3281,133.4199" fill="#9BD0DD"/><path d="M525.9346,133.4199 L525.9346,143.4199 L535.9346,143.4199 L525.9346,133.4199" fill="#9BD0DD"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="253.3921" x="222.3281" y="150.9883">Fond bleu clair : action humaine requise</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.6064" x="222.3281" y="166.2988">(saisie, decision, ou reponse d'un tiers externe)</text><ellipse cx="196.3281" cy="115.7646" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="370.6563" x="11" y="194.041"/><path d="M194.4072,194.041 L194.4072,203.5293 L184.4072,213.5293 L11,213.5293" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="74.2314" x="14" y="208.5762">COLLECTE</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="92.6611" y="208.5762">(automatique)</text><rect fill="#E0F0F4" height="62.3984" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="350.6563" x="21" y="230.5293"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="185.5313" x="31" y="252.1309">HAR, Coverage, Core Web Vitals</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="31" y="266.2637">(analyze_har.py, coverage_metrics.py,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="330.6563" x="31" y="280.3965">collect_cwv_pagespeed.py ou run_lighthouse.sh en repli)</text><rect fill="#ECECF2" height="125.0195" style="stroke:#5BA1BC;stroke-width:1.5;" width="342.2939" x="25.1812" y="315.3809"/><path d="M357.4751,315.3809 L357.4751,324.8691 L347.4751,334.8691 L25.1812,334.8691" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="223.1182" x="28.1812" y="329.916">JUGEMENT AUTOMATIQUE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="255.729" y="329.916">(automatique)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="251.9492" x="70.3535" y="351.8691"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1406" x="80.3535" y="373.4707">run_eof.py confronte les donnees</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="193.1484" x="80.3535" y="387.6035">deja collectees au referentiel EOF</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="231.9492" x="80.3535" y="401.7363">(~10 criteres sur 54 tranches par script,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="170.6719" x="80.3535" y="415.8691">le reste reste "je ne sais pas")</text><rect fill="#9BD0DD" height="206.2617" style="stroke:#5BA1BC;stroke-width:1.5;" width="672.6899" x="20.6035" y="450.4004"/><path d="M317.7607,450.4004 L317.7607,459.8887 L307.7607,469.8887 L20.6035,469.8887" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="99.4287" x="23.6035" y="464.9355">IMPACT CO2e</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="183.2988" x="127.4619" y="464.9355">(optionnel, a tout moment)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="331.4492" x="30.6035" y="486.8887"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="246.1699" x="40.6035" y="508.4902">/efootprint -&gt; modele Boavizta (reference</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="311.4492" x="40.6035" y="522.623">+ 3 scenarios cumules prio1 / prio1+2 / prio1+2+3)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="256.7227" x="40.6035" y="536.7559">-&gt; donnees disponibles pour la PROCHAINE</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="268.7109" x="40.6035" y="550.8887">generation du rapport, pas un ajout final isole</text><path d="M353.9688,573.4199 L353.9688,605.041 L333.9688,609.041 L353.9688,613.041 L353.9688,644.6621 A0,0 0 0 0 353.9688,644.6621 L683.2935,644.6621 A0,0 0 0 0 683.2935,644.6621 L683.2935,583.4199 L673.2935,573.4199 L353.9688,573.4199 A0,0 0 0 0 353.9688,573.4199" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M673.2935,573.4199 L673.2935,583.4199 L683.2935,583.4199 L673.2935,573.4199" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="308.3247" x="359.9688" y="590.9883">Peut se lancer avant ou apres le premier rapport,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="284.4004" x="359.9688" y="606.2988">avant ou apres le questionnaire EOF : chaque</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.8745" x="359.9688" y="621.6094">generation du rapport reprend simplement les</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.2939" x="359.9688" y="636.9199">donnees alors disponibles sur disque.</text><rect fill="#E0F0F4" height="48.2656" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="275.2813" x="58.6875" y="584.9082"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="242.7891" x="68.6875" y="606.5098">Action humaine possible : trafic annuel et</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="255.2813" x="68.6875" y="620.6426">taille d'instance cloud, si non auto-detectes</text><rect fill="#ECECF2" height="139.1523" style="stroke:#5BA1BC;stroke-width:1.5;" width="357.5381" x="17.5591" y="667.1152"/><path d="M365.0972,667.1152 L365.0972,676.6035 L355.0972,686.6035 L17.5591,686.6035" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="238.3623" x="20.5591" y="681.6504">RAPPORT &#8212; premiere generation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="94.7461" x="263.3511" y="681.6504">(automatique)</text><rect fill="#E0F0F4" height="90.6641" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="292.2324" x="50.2119" y="703.6035"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="143.1563" x="60.2119" y="725.2051">generate_report_html.py</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="220.6582" x="60.2119" y="739.3379">(+ check_valeurs_rapport.py, controle</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.8496" x="60.2119" y="753.4707">interne non bloquant)</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="272.2324" x="60.2119" y="767.6035">-&gt; contient deja le jugement EOF automatique</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="195.1055" x="60.2119" y="781.7363">(partiel) et le CO2e si deja calcule</text><rect fill="#9BD0DD" height="249.8164" style="stroke:#5BA1BC;stroke-width:1.5;" width="635.1392" x="40.6367" y="816.2676"/><path d="M408.751,816.2676 L408.751,825.7559 L398.751,835.7559 L40.6367,835.7559" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="151.1973" x="43.6367" y="830.8027">QUESTIONNAIRE EOF</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="202.4873" x="199.2637" y="830.8027">(manuel, decision de mission)</text><rect fill="#E0F0F4" height="76.5313" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="255.5176" x="68.5693" y="852.7559"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="235.5176" x="78.5693" y="874.3574">Quand : apres le jugement automatique,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="198.2227" x="78.5693" y="888.4902">uniquement sur les criteres restes</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="178.6758" x="78.5693" y="902.623">"je ne sais pas" - jamais avant,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.2715" x="78.5693" y="916.7559">jamais declenche seul</text><path d="M362.0195,958.4092 L362.0195,997.6855 L342.0195,1001.6855 L362.0195,1005.6855 L362.0195,1044.9619 A0,0 0 0 0 362.0195,1044.9619 L665.7759,1044.9619 A0,0 0 0 0 665.7759,1044.9619 L665.7759,968.4092 L655.7759,958.4092 L362.0195,958.4092 A0,0 0 0 0 362.0195,958.4092" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><path d="M655.7759,958.4092 L655.7759,968.4092 L665.7759,968.4092 L655.7759,958.4092" fill="#ECECF2" style="stroke:#9BD0DD;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.7563" x="368.0195" y="975.9775">Piege a eviter : ne jamais relancer run_eof.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.6885" x="368.0195" y="991.2881">seul apres une relecture de questionnaire</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.2183" x="368.0195" y="1006.5986">(ecrase les reponses en silence). Toujours</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="281.3154" x="368.0195" y="1021.9092">parse_questionnaire.py -&gt; fusionner_lots.py</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="181.1685" x="368.0195" y="1037.2197">-&gt; generate_report_html.py.</text><rect fill="#E0F0F4" height="104.7969" rx="12.5" ry="12.5" style="stroke:#5BA1BC;stroke-width:0.5;" width="291.3828" x="50.6367" y="949.2871"/><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="271.3828" x="60.6367" y="970.8887">generate_questionnaire.py -&gt; fichier a remplir</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.9199" x="60.6367" y="985.0215">(questionnaire-eof.md), envoye au client,</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="218.0215" x="60.6367" y="999.1543">rempli, relu (parse_questionnaire.py),</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="211.1484" x="60.6367" y="1013.2871">fusionne (fusionner_lots.py) selon la</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="229.2363" x="60.6367" y="1027.4199">precedence collecte &gt; estime &gt; precise</text><text fill="#1C2856" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="121.3887" x="60.6367" y="1041.5527">&gt; declare &gt; suppose</text><rect fill="#ECECF2" height="110.8867" style="stroke:#5BA1BC;stroke-width:1.5;" width="302.748" x="44.9541" y="1076.5371"/><path d="M337.7021,1076.5371 L337.7021,1086.0254 L327.7021,1096.0254 L44.9541,1096.0254" fill="none" style="stroke:#5BA1BC;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" 