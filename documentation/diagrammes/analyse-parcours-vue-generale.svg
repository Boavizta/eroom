<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:800px;height:1540px;background:#FFFFFF;" width="800px" height="1540px" viewBox="0 0 800 1540" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs><filter id="b1llohyemuwqtd0" x="0" y="0" width="1" height="1"><feFlood flood-color="#ECECF2" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter id="b1llohyemuwqtd1" x="0" y="0" width="1" height="1"><feFlood flood-color="#9BD0DD" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="176.909" y="33.535" fill="#000" font-size="14" textLength="444.78" font-weight="700">Web journey analysis — Overview of the workflow (by theme)</text></g><g class="legend" data-source-line="23"><rect x="387.306" y="59.488" width="389.292" height="174.883" fill="none" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="392.306" y="78.023" fill="#000" font-size="14" textLength="52.254" font-weight="700">Legend</text><text x="392.306" y="94.512" fill="#000" font-size="14"> </text><text x="392.306" y="111" fill="#ECECF2" font-size="14" textLength="52.582" filter="url(#b1llohyemuwqtd0)">XXXXXX</text><text x="453.748" y="111" fill="#000" font-size="14" textLength="223.262">Pale grey background: automatic</text><text x="392.306" y="127.488" fill="#000" font-size="14" textLength="267.237">(machine calculation, no human action)</text><text x="392.306" y="143.977" fill="#000" font-size="14"> </text><text x="392.306" y="160.465" fill="#9BD0DD" font-size="14" textLength="52.582" filter="url(#b1llohyemuwqtd1)">XXXXXX</text><text x="453.748" y="160.465" fill="#000" font-size="14" textLength="316.989">Light blue background: human action required</text><text x="392.306" y="176.953" fill="#000" font-size="14" textLength="379.292">(input, decision, or answer from an external third party)</text><text x="392.306" y="193.441" fill="#000" font-size="14"> </text><text x="392.306" y="209.93" fill="#000" font-size="14" textLength="346.835">[ref] Reference doc: capture-har-and-coverage.md</text><text x="392.306" y="226.418" fill="#000" font-size="14" textLength="294.909">../../.claude/skills/analyse-parcours/docs/</text></g><ellipse cx="208.98" cy="262.371" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="62.529" y="282.371" width="718.069" height="193.285" fill="#9BD0DD" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M506.912,282.371 L506.912,291.859 L496.912,301.859 L62.529,301.859" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="65.529" y="296.906" fill="#000" font-size="14" textLength="134.053" font-weight="700">MANUAL CAPTURE</text><text x="204.012" y="296.906" fill="#000" font-size="14" textLength="295.9">[ref] (prerequisite, human, outside the skill)</text><rect x="84.822" y="318.859" width="248.316" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="94.822" y="340.461" fill="#1C2856" font-size="12" textLength="227.818">Network : Preserve log + Disable cache</text><text x="94.822" y="354.594" fill="#1C2856" font-size="12" textLength="175.846">Full journey, cookies accepted</text><text x="94.822" y="368.727" fill="#1C2856" font-size="12" textLength="228.316">-> "Save all as HAR with content" (.har)</text><path d="M365.432,404.491 L365.432,428.457 L345.432,432.457 L365.432,436.457 L365.432,460.423 A0,0 0 0 0 365.432,460.423 L770.598,460.423 A0,0 0 0 0 770.598,460.423 L770.598,414.491 L760.598,404.491 L365.432,404.491 A0,0 0 0 0 365.432,404.491" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><path d="M760.598,404.491 L760.598,414.491 L770.598,414.491 L760.598,404.491" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><text x="371.432" y="422.06" fill="#000" font-size="13" textLength="299.552">cwv.json (Core Web Vitals) optional: Lighthouse</text><text x="371.432" y="437.37" fill="#000" font-size="13" textLength="384.167">launches automatically if absent (collect_cwv_pagespeed.py),</text><text x="371.432" y="452.681" fill="#000" font-size="13" textLength="267.23">or provided by the user (RUM/PageSpeed).</text><rect x="72.529" y="401.258" width="272.902" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="82.529" y="422.859" fill="#1C2856" font-size="12" textLength="180.504">Coverage panel (Cmd+Shift+P)</text><text x="82.529" y="436.992" fill="#1C2856" font-size="12" textLength="123.539">Record, reload, scroll</text><text x="82.529" y="451.125" fill="#1C2856" font-size="12" textLength="252.902">-> export JSON per page (Coverage-*.json)</text><rect x="16" y="485.656" width="385.961" height="110.887" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M199.797,485.656 L199.797,495.145 L189.797,505.145 L16,505.145" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="19" y="500.191" fill="#000" font-size="14" textLength="92.75" font-weight="700">COLLECTION</text><text x="116.18" y="500.191" fill="#000" font-size="14" textLength="76.617">(automatic)</text><rect x="26" y="522.145" width="365.961" height="62.398" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="543.746" fill="#1C2856" font-size="12" textLength="185.531">HAR, Coverage, Core Web Vitals</text><text x="36" y="557.879" fill="#1C2856" font-size="12" textLength="220.658">(analyze_har.py, coverage_metrics.py,</text><text x="36" y="572.012" fill="#1C2856" font-size="12" textLength="345.961">collect_cwv_pagespeed.py or run_lighthouse.sh as fallback)</text><rect x="55.689" y="606.996" width="306.583" height="125.02" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M352.272,606.996 L352.272,616.484 L342.272,626.484 L55.689,626.484" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="58.689" y="621.531" fill="#000" font-size="14" textLength="205.536" font-weight="700">AUTOMATIC EOF JUDGMENT</text><text x="268.655" y="621.531" fill="#000" font-size="14" textLength="76.617">(automatic)</text><rect x="81.98" y="643.484" width="254" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="91.98" y="665.086" fill="#1C2856" font-size="12" textLength="190.658">run_eof.py compares the already</text><text x="91.98" y="679.219" fill="#1C2856" font-size="12" textLength="234">collected data against the EOF reference</text><text x="91.98" y="693.352" fill="#1C2856" font-size="12" textLength="230.004">(~10 criteria out of 54 settled by script,</text><text x="91.98" y="707.484" fill="#1C2856" font-size="12" textLength="166.436">the rest stays "I don't know")</text><rect x="25.917" y="742.016" width="666.38" height="206.262" fill="#9BD0DD" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M289.216,742.016 L289.216,751.504 L279.216,761.504 L25.917,761.504" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="28.917" y="756.551" fill="#000" font-size="14" textLength="99.429" font-weight="700">CO2e IMPACT</text><text x="132.775" y="756.551" fill="#000" font-size="14" textLength="149.44">(optional, at any time)</text><rect x="35.917" y="778.504" width="346.127" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="45.917" y="800.105" fill="#1C2856" font-size="12" textLength="239.484">/efootprint -> Boavizta model (reference</text><text x="45.917" y="814.238" fill="#1C2856" font-size="12" textLength="326.127">+ 3 cumulative scenarios prio1 / prio1+2 / prio1+2+3)</text><text x="45.917" y="828.371" fill="#1C2856" font-size="12" textLength="177.281">-> data available for the NEXT</text><text x="45.917" y="842.504" fill="#1C2856" font-size="12" textLength="273.188">report generation, not an isolated final add-on</text><path d="M359.517,865.035 L359.517,896.656 L339.517,900.656 L359.517,904.656 L359.517,936.277 A0,0 0 0 0 359.517,936.277 L682.297,936.277 A0,0 0 0 0 682.297,936.277 L682.297,875.035 L672.297,865.035 L359.517,865.035 A0,0 0 0 0 359.517,865.035" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><path d="M672.297,865.035 L672.297,875.035 L682.297,875.035 L672.297,865.035" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><text x="365.517" y="882.604" fill="#000" font-size="13" textLength="301.78">Can be launched before or after the first report,</text><text x="365.517" y="897.914" fill="#000" font-size="13" textLength="272.029">before or after the EOF questionnaire: each</text><text x="365.517" y="913.225" fill="#000" font-size="13" textLength="237.809">report generation simply picks up the</text><text x="365.517" y="928.535" fill="#000" font-size="13" textLength="173.393">data then available on disk.</text><rect x="78.444" y="876.523" width="261.072" height="48.266" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="88.444" y="898.125" fill="#1C2856" font-size="12" textLength="241.072">Possible human action: annual traffic and</text><text x="88.444" y="912.258" fill="#1C2856" font-size="12" textLength="236.695">cloud instance size, if not auto-detected</text><rect x="46.369" y="958.277" width="325.223" height="139.152" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M330.859,958.277 L330.859,967.766 L320.859,977.766 L46.369,977.766" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="49.369" y="972.813" fill="#000" font-size="14" textLength="193.443" font-weight="700">REPORT — first generation</text><text x="247.242" y="972.813" fill="#000" font-size="14" textLength="76.617">(automatic)</text><rect x="56.369" y="994.766" width="305.223" height="90.664" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="66.369" y="1016.367" fill="#1C2856" font-size="12" textLength="143.156">generate_report_html.py</text><text x="66.369" y="1030.5" fill="#1C2856" font-size="12" textLength="204.908">(+ check_report_values.py, internal</text><text x="66.369" y="1044.633" fill="#1C2856" font-size="12" textLength="120.299">non-blocking check)</text><text x="66.369" y="1058.766" fill="#1C2856" font-size="12" textLength="285.223">-> already contains the automatic EOF judgment</text><text x="66.369" y="1072.898" fill="#1C2856" font-size="12" textLength="248.555">(partial) and the CO2e if already calculated</text><rect x="59.529" y="1107.43" width="606.218" height="249.816" fill="#9BD0DD" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M406.534,1107.43 L406.534,1116.918 L396.534,1126.918 L59.529,1126.918" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="62.529" y="1121.965" fill="#000" font-size="14" textLength="151.197" font-weight="700">EOF QUESTIONNAIRE</text><text x="218.156" y="1121.965" fill="#000" font-size="14" textLength="181.378">(manual, mission decision)</text><rect x="91.883" y="1143.918" width="234.195" height="76.531" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="101.883" y="1165.52" fill="#1C2856" font-size="12" textLength="214.195">When: after the automatic judgment,</text><text x="101.883" y="1179.652" fill="#1C2856" font-size="12" textLength="132.943">only on the criteria left</text><text x="101.883" y="1193.785" fill="#1C2856" font-size="12" textLength="172.389">"I don't know" - never before,</text><text x="101.883" y="1207.918" fill="#1C2856" font-size="12" textLength="153.75">never triggered on its own</text><path d="M368.432,1249.571 L368.432,1288.848 L348.432,1292.848 L368.432,1296.848 L368.432,1336.124 A0,0 0 0 0 368.432,1336.124 L655.748,1336.124 A0,0 0 0 0 655.748,1336.124 L655.748,1259.571 L645.748,1249.571 L368.432,1249.571 A0,0 0 0 0 368.432,1249.571" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><path d="M645.748,1249.571 L645.748,1259.571 L655.748,1259.571 L645.748,1249.571" style="stroke:#9BD0DD;stroke-width:0.5;" fill="#ECECF2"/><text x="374.432" y="1267.14" fill="#000" font-size="13" textLength="235.93">Trap to avoid: never rerun run_eof.py</text><text x="374.432" y="1282.45" fill="#000" font-size="13" textLength="238.672">alone after a questionnaire read-back</text><text x="374.432" y="1297.761" fill="#000" font-size="13" textLength="266.316">(it silently overwrites the answers). Always</text><text x="374.432" y="1313.071" fill="#000" font-size="13" textLength="261.447">parse_questionnaire.py -> merge_lots.py</text><text x="374.432" y="1328.382" fill="#000" font-size="13" textLength="181.168">-> generate_report_html.py.</text><rect x="69.529" y="1240.449" width="278.902" height="104.797" fill="#E0F0F4" style="stroke:#5BA1BC;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="79.529" y="1262.051" fill="#1C2856" font-size="12" textLength="245.443">generate_questionnaire.py -> file to fill in</text><text x="79.529" y="1276.184" fill="#1C2856" font-size="12" textLength="245.191">(questionnaire-eof.md), sent to the client,</text><text x="79.529" y="1290.316" fill="#1C2856" font-size="12" textLength="258.902">filled in, read back (parse_questionnaire.py),</text><text x="79.529" y="1304.449" fill="#1C2856" font-size="12" textLength="237.176">merged (merge_lots.py) according to the</text><text x="79.529" y="1318.582" fill="#1C2856" font-size="12" textLength="249.85">precedence collected > estimated > stated</text><text x="79.529" y="1332.715" fill="#1C2856" font-size="12" textLength="131.848">> declared > assumed</text><rect x="68.198" y="1367.246" width="281.564" height="110.887" fill="#ECECF2" style="stroke:#5BA1BC;stroke-width:1.5;"/><path d="M332.331,1367.246 L332.331,1376.734 L322.331,1386.734 L68.198,1386.734" style="stroke:#5BA1BC;stroke-width:1.5;" fill="none"/><text x="71.198" y="1381.781" fill="#000" font-size="14" textLength="173.086" font-weight="700">REPORT — regeneration</text><t